  = authorKey,\n\n  \txdm.source.user.identifier = authorAccountId,\n\n  \txdm.event.operation_sub_type
  = category,\n\n  \txdm.target.user.identifier = json_extract_scalar(objectItem,
  \"$.id\"),\n\n  \txdm.target.user.username = json_extract_scalar(objectItem, \"$.name\"),\n\n
  \ \txdm.target.resource.type = json_extract_scalar(objectItem, \"$.typeName\"),\n\n
  \ \txdm.event.outcome = if(jira_status_change != null, XDM_CONST.OUTCOME_SUCCESS,
  jira_status_change = null, null),\n\n  \txdm.event.outcome_reason = jira_status_change;\nschema:
  >-\n  {\n      \"atlassian_jira_raw\": {\n          \"summary\": {\n              \"type\":
