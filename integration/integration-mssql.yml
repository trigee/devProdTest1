detaileddescription: "Use to query SQL Server, using a remote (TCP) connection to
  the DB. \n\nPlease note the default timeout for queries is 30 seconds. To increase
  the timeout set the following parameter in the **Additional connection parameters**
  field: _connection timeout_ (notice the space in the name of the parameter) with
  the desired timeout in seconds. For example to set a timeout of 120 seconds use:
  _connection timeout=120_."
