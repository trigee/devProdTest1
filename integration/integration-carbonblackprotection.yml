    - contentPath: ".={\n\t\t\t\t  ID:                   val.id,\n\t\t\t\t  FileName:
        \            val.fileName,\n\t\t\t\t  PathName:             val.pathName,\n\t\t\t\t
        \ FileCatalogId:        val.fileCatalogId,\n\t\t\t\t  AnalysisResult:       function(status)
        {\n\t\t\t\t                           switch(status) {\n\t\t\t\t                                case
        0:\n\t\t\t\t                                        return \"Not yet available\";\n\t\t\t\t
        \                                       break;\n\t\t\t\t                                case
        1:\n\t\t\t\t                                        return \"File is clean\";\n\t\t\t\t
        \                                       break;\n\t\t\t\t                                case
        2:\n\t\t\t\t                                        return \"File is a potential
        threat\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               case 3:\n\t\t\t\t                                        return
        \"File is malicious\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               default:\n\t\t\t\t                                        return
        \"Not yet available\"\n\t\t\t\t                           }\n\t\t\t\t                        }(val.analysisResult),\n\t\t\t\t
        \ AnalysisStatus:       function(status) {\n\t\t\t\t                           switch(status)
        {\n\t\t\t\t                                case 0:\n\t\t\t\t                                        return
        \"scheduled\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               case 1:\n\t\t\t\t                                        return
        \"submitted\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               case 2:\n\t\t\t\t                                        return
        \"processed\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               case 3:\n\t\t\t\t                                        return
        \"analyzed\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               case 4:\n\t\t\t\t                                        return
        \"error\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               case 5:\n\t\t\t\t                                        return
        \"cancelled\";\n\t\t\t\t                                        break;\n\t\t\t\t
        \                               default:\n\t\t\t\t                                        return
        \"status is not yet available\"\n\t\t\t\t                           }\n\t\t\t\t
        \                       }(val.analysisStatus),\n\t\t\t\t  ConnectorId:          val.connectorId,\n\t\t\t\t
        \ AnalysisTarget:       val.analysisTarget\n\t\t\t\t  ComputerId:           val.computerId,\n\t\t\t\t
        \ DateModified:         val.dateModified,\n\t\t\t\t  DateCreated:          val.dateCreated,\n\t\t\t\t
        \ Priority:             val.priority,\n\t\t\t\t  CreatedBy:            val.createdBy,\n\t\t\t\t
        \ CreatedByUserId:      val.createdByUserId,\n\n\t\t\t\t}"
      contextPath: CbP.FileAnalysis
      description:
        AnalysisResult: 'Result of the analysis. Can be one of: [0-3]'
        AnalysisStatus: 'Status of analysis. Can be one of: [0-5]'
        AnalysisTarget: Target of the analysis (Connector-dependent)
        ComputerId: Id of computer entry associated with this analysis
        ConnectorId: Id of connector associated with this analysis
        CreatedBy: User that requested this analysis
        DateCreated: Date/Time when fileAnalysis request was created (UTC)
        DateModified: Date/Time when fileAnalysis request was last modified (UTC)
        FileCatalogId: Id of fileCatalog entry associated with this analysis
        FileName: Name of the file where file exists on the endpoint
        ID: Unique fileAnalysis id
        PathName: Path of the file where file exists on the endpoint
        Priority: File analysis priority in range [-2, 2], where 2 is highest priority.
          Default priority is 0
    - contentPath: ".={\n\n\t\t\t\t\tFileCatalogId:              function(retVal)
        {\n\t\t\t\t\t\t\t\t\tif(retVal.analysisResult == 0) {\n\t\t\t\t\t\t\t\t\t\treturn
        retVal.fileCatalogId;\n\t\t\t\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\t\t\t\treturn
        undefined;\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t}(val),\n\t\t\t\t\tFileName:\t
        \       function(retVal) {\n\t\t\t\t\t\t\t\t\tif(retVal.analysisResult ==
        0) {\n\t\t\t\t\t\t\t\t\t\treturn retVal.fileName;\n\t\t\t\t\t\t\t\t\t} else
        {\n\t\t\t\t\t\t\t\t\t\treturn undefined;\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t}(val),\n\t\t\t\t\tPathName:
        \              function(retVal) {\n\t\t\t\t\t\t\t\t\tif(retVal.analysisResult
        == 0) {\n\t\t\t\t\t\t\t\t\t\treturn retVal.pathName;\n\t\t\t\t\t\t\t\t\t}
        else {\n\t\t\t\t\t\t\t\t\t\treturn undefined;\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t}(val),\n\t\t\t\t\tMalicious:
        \             function(retVal) {\n\t\t\t\t\t\t\t\t\tif(retVal.analysisResult
        == 0) {\n\t\t\t\t\t\t\t\t\t\treturn {Vendor:\"Carbon Black Protect\", Description:
        \"Analysis Result\"};\n\t\t\t\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\t\t\t\treturn
        undefined;\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t}(val),\n\t\t\t\t\tproperties_to_append:
        \  function(retVal) {\n\t\t\t\t\t\t\t\t\tif(retVal.analysisResult == 0) {\n\t\t\t\t\t\t\t\t\t\treturn
        ['Malicious'];\n\t\t\t\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\t\t\t\treturn undefined;\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t}(val),\n\t\t\t\t\t}"
      contextPath: File(val.CatalogID && val.CatalogID == obj.CatalogID)
      description:
        FileCatalogId: Id of fileCatalog entry associated with this analysis
        FileName: Name of the file where file exists on the endpoint
        Malicious: Vendor and description of malicious file
        PathName: Path of the file where file exists on the endpoint
    supportedModules: []
