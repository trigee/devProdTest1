description: Rocket Jobs Indicator Generator
detaileddescription: |
  #### Integration Author: Ruth Milano Mahalla
  Based on JSON Sample Incident Generator integration by Nicholas Ericksen

  ## Testing integration for the Rocket project
display: Rocket Jobs Indicator Generator
image: data:image/png;base64,
name: Rocket Jobs Indicator Generator
restrictioncenter: {}
script:
  dockerimage: demisto/python3:3.10.4.30607
  feed: true
  isFetchSamples: true
  runonce: false
  script: |
    import time
    import json
    from datetime import datetime
    from enum import Enum
    import random
    import string


    START_TIME = datetime.now().isoformat().split("Z", 1)[0] + "Z"


    def main() -> None:
        command = demisto.command()
        params = demisto.params()
        integration_instance = demisto.integrationInstance()

        objects_count = int(params.get("objectsCount", 1))
        data = json.loads(params.get('JSON'))

        integration_context: Dict = get_integration_context()
        new_context = {'counter': objects_count, 'modified': False}
        if not integration_context.get('counter'):
            set_integration_context(new_context)
            integration_context = get_integration_context()
        objects_count = integration_context['counter']
        new_context['counter'] = objects_count + int(params.get('number_of_indicators_to_add'))
        if params.get('modified_score'):
            new_context['modified'] = not new_context['modified']
        set_integration_context(new_context)

        demisto.debug(f'Command being called is {command}')
        try:
            indicators = []
            for i in range(objects_count):
                indicator_name = f'{params.get("indicatorPrefix")}_{i}'
                indicator_type = params.get('indicator_type')
                indicator = {
                    'value': indicator_name,
                    'type': indicator_type,
                    "rawJSON": {
                        'value': indicator_name,
                        'type': indicator_type
                    },
                    'score': int(params.get('modified_score')) if integration_context['modified'] else 0  # change verdict from unknown to Suspicious
                }
                if str(i) == params.get('indicator_to_process_index') and params.get('indicator_to_process_value'):  # indicator index and value to be processed by a job
                    indicator['value'] = params['indicator_to_process_value']

                indicators.append(indicator)

            # we submit the indicators in batches
            for b in batch(indicators, batch_size=20000):
                demisto.createIndicators(b)

            demisto.setLastRun({"rocket": str(params.get("last_run_data"))})


        # Log exceptions and return errors
        except Exception as e:
            demisto.error(traceback.format_exc())  # print the traceback
            return_error(f'Failed to execute {demisto.command()} command.\nError:\n{str(e)}')


    ''' ENTRY POINT '''
    if __name__ in ('__main__', '__builtin__', 'builtins'):
        main()
  subtype: python3
  type: python
