deprecated: true
description: Deprecated. Use the Mattermost v2 integration instead.
detaileddescription: |-
  ### To use the mattermost integration:

  1. Create a new Mattermost user (to act as the Mattermost Bot)
  2. Under "Manage Members", make it a Team Admin
  3. Create a Personal Access Token for the new account ([Detailed Instructions...](https://docs.mattermost.com/developer/personal-access-tokens.html))
  4. Copy the Access Token to the "Personal Access Token" field
