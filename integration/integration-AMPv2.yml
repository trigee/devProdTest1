    description: Returns a fine-grained isolation status for a computer. The available
      flag is set to true if isolation can be performed on the computer. Status will
      be set to one of - not_isolated, pending_start, isolated and pending_stop. Isolation
      must be enabled within the computer's policy. This can be done through the instance.
      Log in to your account -> Management -> Policies -> Choose the relevant policy
      -> Edit -> Advanced Settings -> Endpoint Isolation -> Allow Endpoint Isolation.
