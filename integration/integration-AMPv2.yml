description: Cisco Advanced Malware Protection software is designed to prevent, detect,
  and help remove threats in an efficient manner from computer systems. Threats can
  take the form of software viruses and other malware such as ransomware, worms, Trojans,
  spyware, adware, and fileless malware.
detaileddescription: "# Cisco AMP Secure Endpoint\nCisco Advanced Malware Protection
  software is designed to prevent, detect, and help remove threats in an efficient
  manner from computer systems.\nThreats can take the form of software viruses and
  other malware such as ransomware, worms, Trojans, spyware, adware, and fileless
  malware.\n\n# See the API Documentation\nThe API documentation can be found in:
  [Cisco AMP API](https://api-docs.amp.cisco.com/).</br>\nChoose the relevant API
  and then select version: `v1`.\n\n# Fetch Incidents\nIncidents are fetched through
  the command: `cisco-amp-event-list`.</br>\nThe fetched event types can be controlled
  through `event_id` that can be received from the command: `cisco-amp-event-type-list`.\n\n#
  Polling Command\nThe following commands support polling: \n- `cisco-amp-computer-isolation-create`\n-
  `cisco-amp-computer-isolation-delete`\n\nThe polling is done when the status of
  an endpoint has changed.\n\n# Get License Information\nThe following command is
  used to get license information about the tenant such as number of connectors\n
  \     registered, tier level and licensed seats count: `cisco-amp-license-get`\n\n\n---\n[View
  Integration Documentation](https://xsoar.pan.dev/docs/reference/integrations/am-pv2)"
