      description: 'The direction of the rule. Possible values are: "Inbound" and
        "Outbound".'
      name: direction
      predefined:
      - Inbound
      - Outbound
      supportedModules: []
    - auto: PREDEFINED
      description: Whether to allow the traffic. Possible values are "Allow" and "Deny".
      name: action
      predefined:
      - Allow
      - Deny
      supportedModules: []
    - auto: PREDEFINED
      description: 'The protocol on which to apply the rule. Possible values are:
        "Any", "TCP", "UDP", and "ICMP".'
      name: protocol
      predefined:
      - Any
      - TCP
      - UDP
      - ICMP
      supportedModules: []
    - description: The source IP address range from which incoming traffic will be
        allowed or denied by this rule. Possible values are "Any", an IP address range,
        an application security group, or a default tag. Default is "Any".
      name: source
      supportedModules: []
    - description: The priority by which the rules will be processed. The lower the
        number, the higher the priority. We recommend leaving gaps between rules -
        100, 200, 300, etc. - so that it is easier to add new rules without having
        to edit existing rules. Default is "4096".
      name: priority
      supportedModules: []
    - description: The source ports from which traffic is allowed or denied by this
        rule. Provide a single port, such as 80; a port range, such as 1024-65535;
        or a comma-separated list of single ports and/or port ranges, such as 80,1024-65535.
        Use an asterisk (*) to allow traffic on any port. Default is "*".
      name: source_ports
      supportedModules: []
    - description: The destination IP address range for outgoing traffic that is allowed
        or denied by this rule. The destination filter can be "Any", an IP address
        range, an application security group, or a default tag.
      name: destination
      supportedModules: []
    - description: The destination ports from which traffic is allowed or denied by
        this rule. Provide a single port, such as 80; a port range, such as 1024-65535;
        or a comma-separated list of single ports and/or port ranges, such as 80,1024-65535.
        Use an asterisk (*) to allow traffic on any port.
      name: destination_ports
      supportedModules: []
    - description: A description to add to the rule.
      name: description
      supportedModules: []
    - auto: PREDEFINED
      description: The network traffic is allowed or denied.
      name: access
      predefined:
      - Allow
      - Deny
      supportedModules: []
    deprecated: true
