script:
  dockerimage: demisto/python3:3.10.4.30607
  isfetch: true
  longRunning: true
  runonce: false
  script: |
    import time
    import json
    from datetime import datetime


    START_TIME = datetime.now().isoformat().split("Z", 1)[0] + "Z"


    def main() -> None:
        command = demisto.command()
        params = demisto.params()
        integration_instance = demisto.integrationInstance()

        object_name = demisto.getParam("name")
        if not object_name:
            object_name = f"Rocket Sample - {integration_instance}"
        objects_count = int(params.get("objectsCount", 1))
        data = json.loads(params.get('JSON'))
        data['demisto_url'] = demisto.demistoUrls()

        demisto.debug(f'Command being called is {command}')
        try:
            if command == 'test-module':
                return_results("ok")

            elif command == 'fetch-incidents':
                # integration must succeed at least once, to be considered properly failed for notification purposes
                if params.get("failed_instance") and demisto.getLastRun():
                    failure_msg = params.get("failure_msg")
                    return_error(failure_msg)

                if params.get("OneTimeFetcher") and demisto.getLastRun():
                    demisto.debug('This is one timer fetcher, no more incidents for you')
                    demisto.incidents([])
                    return

                incidents = []
                for i in range(objects_count):
                    incident = {
                        'name': object_name,
                        'details': json.dumps(data),
                        'occurred': datetime.now().isoformat().split("Z", 1)[0] + "Z",
                        'rawJSON': json.dumps(data)
                    }

                    if demisto.getParam("file_name"):
                        file_result = fileResult(demisto.getParam("file_name"), json.dumps(data))
                        file_names = [{'path': file_result.get('FileID', ''), 'name': file_result.get('File', '')}]
                        incident["attachment"] = file_names

                    incidents.append(incident)

                demisto.incidents(incidents)
                last_run_data = params.get("last_run_data") or datetime.now().isoformat().split("Z", 1)[0] + "Z"
                demisto.setLastRun({"rocket": str(last_run_data)})

            elif command == 'long-running-execution':
                while True:
                    incidents = [{
                        'name': object_name,
                        'occurred': datetime.now().isoformat().split("Z", 1)[0] + "Z",
                        'details': START_TIME,
                        'rawJSON': json.dumps(data)
                    }]
                    demisto.createIncidents(incidents, lastRun=None, userID=None)
                    demisto.setLastRun({"done": datetime.now().isoformat().split("Z", 1)[0] + "Z"})
                    time_to_sleep = int(params.get("longRunSleep", 30))
                    time.sleep(time_to_sleep)


        # Log exceptions and return errors
        except Exception as e:
            demisto.error(traceback.format_exc())  # print the traceback
            return_error(f'Failed to execute {demisto.command()} command.\nError:\n{str(e)}')


    ''' ENTRY POINT '''
    if __name__ in ('__main__', '__builtin__', 'builtins'):
        main()
  subtype: python3
  type: python
