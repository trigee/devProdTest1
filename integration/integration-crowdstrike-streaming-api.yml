description: Deprecated - We recommend using CrowdStrike Falcon Streaming v2 instead.
  The Falcon Streaming API (formerly known as the Falcon Firehose API)
detaileddescription: |-
  Use CrowdStrike Streaming API to fetch detections and create incidents from them.
  CrowdStrike uses API keys to provide access to the Falcon Streaming API and to restrict the data returned.
  These credentials are different than the Query API and Threat Graph API credentials.
  Your API key and UUID are on the API Key page. There is one API key and UUID per customer ID.
