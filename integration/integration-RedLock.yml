    description: Search alerts on the Prisma Cloud (RedLock) platform. If no time-range
      arguments are given, the search will filter only alerts from the last 7 days.
    name: redlock-search-alerts
    outputs:
    - contextPath: Redlock.Alert.ID
      description: The ID of the returned alert.
      type: string
    - contextPath: Redlock.Alert.Status
      description: The status of the returned alert.
