    def translate_severity(alert):
        """
        Translate alert severity to demisto
        Might take risk grade into account in the future
        """
        severity = demisto.get(alert, 'policy.severity')
        if severity == 'high':
            return 3
        if severity == 'medium':
            return 2
        if severity == 'low':
            return 1
        return 0


