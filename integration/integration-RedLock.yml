        Should be provided along with time-range-date-to. If not both are provided,
        the time range will be set to the last 7 days and this argument will be ignored.
      name: time-range-date-from
      supportedModules: []
    - description: End time for search in the following format -  MM/DD/YYYY, Should
        be provided along with time-range-date-from. If not both are provided, the
