script:
  commands:
  - arguments:
    - auto: PREDEFINED
      description: Type of indicator to create. Only supported types are valid (IP/FILE/EMAIL).
      name: type
      predefined:
      - IP
      - FILE
      - EMAIL
      supportedModules: []
    - description: The reliability score to assign to dbot score. Default is A - Completely
        reliable
      name: reliability
      supportedModules: []
    - auto: PREDEFINED
      description: The expected verdict that indicator should get
      name: score
      predefined:
      - Unknown
      - Benign
      - Suspicious
      - Malicious
      supportedModules: []
    - description: Comma-separated list of values for the indicators of relevant type
      name: indicators
      supportedModules: []
    description: Creates indicator with specified dbot score
    name: create-indicator-with-dbot-score
    supportedModules: []
  dockerimage: demisto/python3:3.10.4.30607
  feed: true
  runonce: false
  script: |
    import time
    import json
    from datetime import datetime
    from enum import Enum


    START_TIME = datetime.now().isoformat().split("Z", 1)[0] + "Z"


    def main() -> None:
        command = demisto.command()
        params = demisto.params()
        integration_instance = demisto.integrationInstance()

        objects_count = int(params.get("objectsCount", 1))
        data = json.loads(params.get('JSON'))

        demisto.debug(f'Command being called is {command}')
        try:
            if command == 'test-module':
                return_results("ok")

            elif command == 'fetch-indicators':
                if params.get("OneTimeFetcher") and demisto.getLastRun():
                    demisto.debug('This is one timer fetcher, no more indicators for you')
                    demisto.createIndicators([])
                    return

                indicators = []
                for i in range(objects_count):
                    indicator_name = f'{params.get("indicatorPrefix")}_{i}'
                    indicator_type = 'Host'
                    indicator = {
                        'value': indicator_name,
                        'type': indicator_type,
                        "rawJSON": {'value': indicator_name, 'type': indicator_type},
                    }
                    indicators.append(indicator)

                # we submit the indicators in batches
                for b in batch(indicators, batch_size=20000):
                    demisto.createIndicators(b)

                demisto.setLastRun({"rocket": str(params.get("last_run_data"))})

            elif command == 'create-indicator-with-dbot-score':
                args = demisto.args()
                class IndicatorTypeMapping(Enum):
                    """
                    The indicator type mapping allows us to define dbot score indicator type for score,
                    the indicator class name from CommonServerPython and the name of the parameter used as indicator value ip/md5/address/url/domain
                    """
                    IP = DBotScoreType.IP, Common.IP, 'ip'
                    FILE = DBotScoreType.FILE, Common.File, 'md5'
                    EMAIL = DBotScoreType.EMAIL, Common.EMAIL, 'address'

                    def __init__(self, dbot_score_type, common_indicator_type, param_name):
                        self.dbot_score_type = dbot_score_type
                        self.common_indicator_type = common_indicator_type
                        self.param_name = param_name

                    @classmethod
                    def _missing_(cls, value):
                        return [i for i in cls if i.name == value][0]

                    @property
                    def value(self):
                        return self.dbot_score_type

                SOURCE_RELIABILITY_MAP = {
                    "A+ - 3rd party enrichment":DBotScoreReliability.A_PLUS,
                    "A - Completely reliable":DBotScoreReliability.A,
                    "B - Usually reliable":DBotScoreReliability.B,
                    "C - Fairly reliable":DBotScoreReliability.C,
                    "D - Not usually reliable":DBotScoreReliability.D,
                    "E - Unreliable":DBotScoreReliability.E,
                    "F - Reliability cannot be judged":DBotScoreReliability.F,
                }
                SCORE_TO_DBOT = {
                    'Unknown': Common.DBotScore.NONE,
                    'Benign': Common.DBotScore.GOOD,
                    'Suspicious': Common.DBotScore.SUSPICIOUS,
                    'Malicious': Common.DBotScore.BAD
                }

                indicator_type = IndicatorTypeMapping(args.get('type', 'IP'))
                score = SCORE_TO_DBOT[args.get('score', 'Unknown')]
                reliability = SOURCE_RELIABILITY_MAP[args.get('reliability', "A - Completely reliable")]
                indicator_list=args.get('indicators').split(",")
                results = []
                for indicator_value in indicator_list:
                    dbot_score = Common.DBotScore(
                        indicator=indicator_value,
                        indicator_type=indicator_type.dbot_score_type,
                        integration_name=demisto.integrationInstance(),
                        score=score,
                        reliability=reliability,
                        )
                    indicator=indicator_type.common_indicator_type(
                            dbot_score=dbot_score,
                            **{indicator_type.param_name:indicator_value},
                            )
                    results.append(CommandResults(
                        indicator=indicator,
                        outputs_prefix='RocketIndicatorGenerator',
                        outputs_key_field=indicator_type.name.lower(),
                        readable_output=f"Indicator {indicator_value} of type {indicator_type.name} was created/updated with dbot_score {score}"
                        ))

                return_results(results)



        # Log exceptions and return errors
        except Exception as e:
            demisto.error(traceback.format_exc())  # print the traceback
            return_error(f'Failed to execute {demisto.command()} command.\nError:\n{str(e)}')


    ''' ENTRY POINT '''
    if __name__ in ('__main__', '__builtin__', 'builtins'):
        main()
