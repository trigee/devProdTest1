description: This is Rocket Email Enrichment integration. It scores indicators of
  type Email based on the configured setting. Note that only email addresses which
  are mentioned in affected_emails parameter during instance creation, are actually
  scored - to avoid side effects on other tests.
detaileddescription: |
  ### Community Contributed Integration
   #### Integration Author: Ivan Shestakov
  Indicator enrichment integration.
  Calculates indicator score according to provided settings.
  For test purposes, an integration instance should be created with selected reliability and expected verdict, as well as list of email addresses (comma-separated) which the integration would be able to enrich.
display: Rocket Email Enrichment
image: data:image/png;base64,
name: Rocket Email Enrichment
restrictioncenter: {}
script:
  commands:
  - arguments:
    - default: true
      description: E-mail address to review/enrich
      isArray: true
      name: email
      required: true
      supportedModules: []
    description: Enrich indicator of type Email, defining its score
    name: email
    outputs:
    - contextPath: DBotScore.Indicator
      description: The indicator that was enriched
      type: string
    - contextPath: DBotScore.Score
      description: The calculated score
      type: number
    - contextPath: DBotScore.Type
      description: The indicator type
      type: string
    - contextPath: DBotScore.Vendor
      description: The vendor used to calculate the score
      type: string
    supportedModules: []
  - arguments: []
    description: Generate indicators of type Email, simulating feed integration
    name: fetch-indicators
    supportedModules: []
  dockerimage: demisto/python3:3.10.12.63474
  feed: true
  isFetchSamples: true
  runonce: false
  script: |
    import json


    SOURCE_RELIABILITY_MAP = {
        "A+ - 3rd party enrichment":DBotScoreReliability.A_PLUS,
        "A - Completely reliable":DBotScoreReliability.A,
        "B - Usually reliable":DBotScoreReliability.B,
        "C - Fairly reliable":DBotScoreReliability.C,
        "D - Not usually reliable":DBotScoreReliability.D,
        "E - Unreliable":DBotScoreReliability.E,
        "F - Reliability cannot be judged":DBotScoreReliability.F,
    }

    SCORE_TO_DBOT = {
        'Unknown': Common.DBotScore.NONE,
        'Benign': Common.DBotScore.GOOD,
        'Suspicious': Common.DBotScore.SUSPICIOUS,
        'Malicious': Common.DBotScore.BAD
    }

    def reputation_command(indicator_list: list, score: str, reliability: str, affected_emails: list) -> List[CommandResults]:
        """
        Args:
            indicator_list:
            score:
            reliability:
            affected_emails:

        Returns:
            indicator reputation for the given indicators, provided they're on the affected_list
        """
        results = []

        for indicator in indicator_list:
            if indicator.lower() in affected_emails:
                indicator_score = SCORE_TO_DBOT.get(score)
                demisto.info(f'handling {indicator=} with {indicator_score=}')
                dbot_score = Common.DBotScore(
                    indicator=indicator,
                    indicator_type=DBotScoreType.EMAIL,
                    integration_name=demisto.integrationInstance(),
                    score=indicator_score,
                    reliability=SOURCE_RELIABILITY_MAP.get(reliability),
                )

                readable_output = f"Indicator for {indicator} was created with {indicator_score=} using {demisto.integrationInstance()}"

                results.append(CommandResults(
                    outputs_prefix='rocketEmailEnrichment',
                    outputs_key_field='email',
                    indicator=Common.EMAIL(address=indicator, dbot_score=dbot_score),
                    readable_output=readable_output,
                ))
            else:
                demisto.info(f'{indicator=} is not in affected_emails list, skipping it')

        return results


    def main() -> None:
        demisto.info(f'Command being called is {demisto.command()}')
        score_from_param = demisto.params().get('feedReputation')
        reliability_param = demisto.params().get('feedReliability')
        affected_emails = [email.lower() for email in demisto.params().get('affected_emails','').split(',')]
        custom_fields = demisto.params().get('customFields', None)

        try:
            args = demisto.args()
            if demisto.command() == 'test-module':
                return_results('ok')

            elif demisto.command() == 'email':
                demisto.info(f'Running {demisto.command()} with {score_from_param=} and {reliability_param=}')
                return_results(reputation_command(indicator_list=argToList(args.get('email', [])),
                                                  score=score_from_param,
                                                  reliability=reliability_param,
                                                  affected_emails=affected_emails))

            elif demisto.command() == 'fetch-indicators':
                demisto.info(f'Running {demisto.command()} with {score_from_param=} and {reliability_param=}')
                indicators = []
                for email in affected_emails:
                    value = email
                    indicator_type = "Email"
                    indicator_score = SCORE_TO_DBOT.get(score_from_param, Common.DBotScore.NONE)
                    indicator = {
                        "value": value,
                        "type": indicator_type,
                        "score": indicator_score,
                        "rawJson": {'value':value, 'type': indicator_type, 'score': indicator_score}
                    }
                    if custom_fields:
                        indicator["fields"] = json.loads(custom_fields)
                    indicators.append(indicator)
                # we submit the indicators in batches
                for b in batch(indicators, batch_size=20000):
                    demisto.createIndicators(b)


        # Log exceptions and return errors
        except Exception as e:
            return_error(f'Failed to execute {demisto.command()} command.\nError:\n{str(e)}')

    if __name__ in ('__main__', '__builtin__', 'builtins'):
        main()
  subtype: python3
  type: python
signature: ""
