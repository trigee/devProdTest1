detaileddescription: |-
  ### You may add a combination of filters, leave empty to convert all incoming logs to incidents.

  ### Filter types:

  * Regex - Use a regular expression as a filter.
  Example: "[abc]", that matches the letters 'a', 'b' or 'c', will filter the logs "boot" or "cab", but will not filter the log "system"".
  Example: "abc", will filter the string "abc" but will not filter the strings "ab" or "bac".
  * Equal - Compare the field to the filter, match if they are exactly equal.
  Example: "localhost" will filter by a field "ocalhost" but will not filter by a field "localhost-1".
  * Greater than - Compare the field to the filter, match if it is greater than the filter.
  Example: 17 will filter by a field 10 but will not filter by a field 17 or 20.

  *Applies only to incoming logs from the moment the module was enabled (previously received logs will not be converted)*
