description: Send messages and notifications to your Slack team.
detaileddescription: "Slack V3 utilizes \"Socket Mode\" to enable the integration
  to communicate directly with Slack for mirroring. \nThis requires a dedicated Slack
  app to be created for the XSOAR integration. For instructions on how to create and
  configure your custom Slack app, please review the documentation found [here](https://xsoar.pan.dev/docs/reference/integrations/slack-v3).\n\n\n---\n[View
  Integration Documentation](https://xsoar.pan.dev/docs/reference/integrations/slack-v3)"
display: Slack v3
image: data:image/png;base64,
