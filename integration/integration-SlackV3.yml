name: SlackV3
restrictioncenter: {}
script:
  commands:
  - arguments:
    - auto: PREDEFINED
      default: true
      defaultValue: all
      description: The mirroring type. Can be "all", which mirrors everything, "chat",
        which mirrors only chats (not commands), or "none", which stops all mirroring.
      name: type
      predefined:
      - all
      - chat
      - none
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: "true"
      description: Whether the channel is auto-closed when an investigation is closed.
        Can be "true" or "false". Default is "true".
      name: autoclose
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: Both
      description: The mirroring direction.
      name: direction
      predefined:
      - Both
      - FromDemisto
      - ToDemisto
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: group
      description: The channel type.
      name: mirrorTo
      predefined:
      - channel
      - group
      supportedModules: []
    - description: The name of the channel. The default is "incident-<incidentID>".
      name: channelName
      supportedModules: []
    - description: The topic of the channel.
      name: channelTopic
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: "false"
      description: Whether to remove the Slack administrator (channel creator) from
        the mirrored channel.
      name: kickAdmin
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: "true"
      description: Whether the mirrored channel should be private or not (true by
        default).
      name: private
      predefined:
      - "true"
      - "false"
      supportedModules: []
    description: Mirrors the investigation between Slack and the Cortex War Room.
    name: mirror-investigation
    supportedModules: []
  - arguments:
    - default: true
      description: 'The message content. When mentioning another Slack user, make
        sure to do so in the following format: <@user_name>.'
      name: message
      supportedModules: []
    - description: The user to whom to send the message. Can be either the username
        or email address.
      name: to
      supportedModules: []
    - description: The name of the Slack channel to which to send the message.
      name: channel
      supportedModules: []
    - description: The ID of the Slack channel to which to send the message.
      name: channel_id
      supportedModules: []
    - description: An entry ID to send as a link.
      name: entry
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: "false"
      description: Whether to include a URL to the relevant component in Cortex.
      name: ignoreAddURL
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - description: The ID of the thread to which to reply. Can be retrieved from a
        previous send-notification command.
      name: threadID
      supportedModules: []
    - description: A JSON string of Slack blocks to send in the message.
      name: blocks
      supportedModules: []
    description: Sends a message to a user, group, or channel.
    name: send-notification
    outputs:
    - contextPath: Slack.Thread.ID
      description: The Slack thread ID.
      type: String
    supportedModules: []
  - arguments:
    - description: The name of the channel to archive. If not provided, the mirrored
        investigation channel is archived (if the channel exists).
      name: channel
      supportedModules: []
    - description: The ID of the channel to archive. If not provided, the mirrored
        investigation channel is archived (if the channel exists).
      name: channel_id
      supportedModules: []
    description: Archives a Slack channel.
    name: close-channel
    supportedModules: []
  - arguments:
    - default: true
      description: The ID of the file entry to send.
      name: file
      required: true
      supportedModules: []
    - description: The user to whom to send the file. Can be the username or the email
        address.
      name: to
      supportedModules: []
    - description: The name of the Slack group (private channel) to which to send
        the file.
      name: group
      supportedModules: []
    - description: The name of the Slack channel to which to send the file.
      name: channel
      supportedModules: []
    - description: The ID of the Slack channel to which to send the file.
      name: channel_id
      supportedModules: []
    - description: The ID of the thread to which to reply. Can be retrieved from a
        previous send-notification command.
      name: threadID
      supportedModules: []
    - description: A comment to add to the file.
      name: comment
      supportedModules: []
    description: Sends a file to a user, channel, or group. If not specified, the
      file is sent to the mirrored investigation channel (if the channel exists).
    name: slack-send-file
    supportedModules: []
  - arguments:
    - description: The channel name. If not specified, the topic of the mirrored investigation
        channel is set (if the channel exists).
      name: channel
      supportedModules: []
    - description: The channel ID. If not specified, the topic of the mirrored investigation
        channel is set (if the channel exists).
      name: channel_id
      supportedModules: []
    - default: true
      description: The topic for the channel.
      name: topic
      required: true
      supportedModules: []
    description: Sets the topic for a channel.
    name: slack-set-channel-topic
    supportedModules: []
  - arguments:
    - auto: PREDEFINED
      defaultValue: private
      description: The channel type.
      name: type
      predefined:
      - private
      - public
      supportedModules: []
    - default: true
      description: The name of the channel.
      name: name
      required: true
      supportedModules: []
    - description: 'A CSV list of user names or email addresses to invite to the channel.
        For example: "user1, user2...".'
      name: users
      supportedModules: []
    description: Creates a channel in Slack.
    name: slack-create-channel
    outputs:
    - contextPath: Slack.Channel.ID
      description: The ID of the channel.
      type: String
    - contextPath: Slack.Channel.Name
      description: The name of the channel.
      type: String
    supportedModules: []
  - arguments:
    - default: true
      description: 'A CSV list of usernames or email addresses to invite to join the
        channel. For example: "user1, user2...".'
      name: users
      required: true
      supportedModules: []
    - description: The name of the channel to which to invite the users. If the name
        of the channel is not specified, the name of the mirrored investigation channel
        is used (if the channel exists).
      name: channel
      supportedModules: []
    - description: The ID of the channel to which to invite the users. If the ID of
        the channel is not specified, the ID of the mirrored investigation channel
        is used (if the channel exists).
      name: channel_id
      supportedModules: []
    description: Invites users to join a channel.
    name: slack-invite-to-channel
    supportedModules: []
  - arguments:
    - default: true
      description: 'A CSV list of usernames or email addresses to remove from the
        a channel. For example: "user1, user2...".'
      name: users
      required: true
      supportedModules: []
    - description: The name of the channel from which to remove the users. If the
        name of the channel is not specified, the mirrored investigation channel is
        used (if the channel exists).
      name: channel
      supportedModules: []
    - description: The ID of the channel from which to remove the users. If the ID
        of the channel is not specified, the mirrored investigation channel is used
        (if the channel exists).
      name: channel_id
      supportedModules: []
    description: Removes users from the specified channel.
    name: slack-kick-from-channel
    supportedModules: []
  - arguments:
    - default: true
      description: The new name of the channel.
      name: name
      required: true
      supportedModules: []
    - description: The current name of the channel. If the name of the channel is
        not specified, the mirrored investigation channel is used (if the channel
        exists).
      name: channel
      supportedModules: []
    - description: The current ID of the channel. If the ID of the channel is not
        specified, the mirrored investigation channel is used (if the channel exists).
      name: channel_id
      supportedModules: []
    description: Renames a channel in Slack.
    name: slack-rename-channel
    supportedModules: []
  - arguments:
    - default: true
      description: The Slack user (username, email or user ID).
      name: user
      required: true
      supportedModules: []
    compliantpolicies:
    - User Hard Remediation
    - User Soft Remediation
    description: Get details about a specified user.
    name: slack-get-user-details
    outputs:
    - contextPath: Slack.User.ID
      description: The ID of the user.
      type: String
    - contextPath: Slack.User.Username
      description: The username of the user.
      type: String
    - contextPath: Slack.User.Name
      description: The actual name of the user.
      type: String
    - contextPath: Slack.User.DisplayName
      description: The display name of the user.
      type: String
    - contextPath: Slack.User.Email
      description: The email address of the user.
      type: String
    - contextPath: Slack.User.StatusText
      description: The status text of the user.
      type: String
    supportedModules: []
  - arguments: []
    description: Returns the integration context as a file. Use this command for debug
      purposes only.
    hidden: true
    name: slack-get-integration-context
    supportedModules: []
  - arguments:
    - description: The channel containing the message.
      name: channel
      supportedModules: []
    - description: The ID of the thread of which to pin. Can be retrieved from a previous
        send-notification command.
      name: threadID
      required: true
      supportedModules: []
    - description: The ID for the channel containing the message.
      name: channel_id
      supportedModules: []
    description: Pins a selected message to the given channel.
    name: slack-pin-message
    supportedModules: []
  - arguments:
    - description: The channel the message is posted in.
      name: channel
      supportedModules: []
    - description: The ID for the channel the message is posted in.
      name: channel_id
      supportedModules: []
    - description: The ID of the thread of which to edit. Can be retrieved from a
        previous send-notification command.
      name: threadID
      required: true
      supportedModules: []
    - description: The updated message.
      name: message
      supportedModules: []
    - description: A JSON string of the block to send.
      name: blocks
      supportedModules: []
    - description: Whether to include a URL to the relevant component in XSOAR. Can
        be "true" or "false". Default value is "false".
      name: ignore_add_url
      supportedModules: []
    description: Edit an existing Slack message.
    name: slack-edit-message
    outputs:
    - contextPath: Slack.Thread.ID
      description: The timestamp identifier for the message.
      type: String
    - contextPath: Slack.Thread.Channel
      description: The channel ID the message was posted in.
      type: String
    - contextPath: Slack.Thread.Text
      description: The text the message was updated with.
      type: String
    supportedModules: []
  - arguments:
    - description: The user id of the user.
      name: user_id
      required: true
      supportedModules: []
    compliantpolicies:
    - User Soft Remediation
    description: Reset user session token in Slack.
    name: slack-user-session-reset
    supportedModules: []
  - arguments:
    - description: Supply this argument to only return channels with this name.
      name: name_filter
      supportedModules: []
    - defaultValue: public_channel
      description: 'You can provide a comma separated list of other channels to include
        in your results. Possible options are: "public_channel", "private_channel",
        "mpim", and "im".  Including these options may require changes to your Bot''s
        OAuth scopes in order to read channels like private, group message, or personal
        messages.'
      name: channel_types
      supportedModules: []
    - defaultValue: "true"
      description: Default is true (exclude archived channels). This setting allows
        the command to read channels that have been archived.
      name: exclude_archived
      supportedModules: []
    - defaultValue: "100"
      description: Set this argument to specify how many results to return. If you
        have more results than the limit you set, you will need to use the cursor
        argument to paginate your results.
      name: limit
      supportedModules: []
    - description: Default is the first page of results. If you have more results
        than your limit, you need to paginate your results with this argument.  This
        is found with the next_cursor attribute returned by a previous request's response_metadata.
      name: cursor
      supportedModules: []
    description: 'List all of the channels in the organization workspace. This command
      required scopes depend on the type of channel-like object you''re working with.
      To use the command, you''ll need at least one of the channels:, groups:, im:
      or mpim: scopes corresponding to the conversation type you''re working with.'
    name: slack-list-channels
    outputs:
    - contextPath: Slack.Channels.ID
      description: The ID for the channel.
      type: string
    - contextPath: Slack.Channels.Name
      description: Name of the channel.
      type: string
    - contextPath: Slack.Channels.Created
      description: Epoch timestamp when the channel was created.
      type: number
    - contextPath: Slack.Channels.Creator
      description: ID for the creator of the channel.
      type: string
    - contextPath: Slack.Channels.Purpose
      description: The purpose, or description, of the channel.
      type: string
    supportedModules: []
  - arguments:
    - deprecated: true
      description: Deprecated. Use *conversation_id* instead.
      name: channel_id
      supportedModules: []
    - description: The name of the conversation. For channels, provide the channel
        name. For direct messages, use the username or display name. Either this or
        *conversation_id* is required. If both are provided, *conversation_id* takes
        precedence.
      name: conversation_name
      supportedModules: []
    - description: The ID of the conversation. Either this or *conversation_name*
        is required. If both are provided, *conversation_id* takes precedence.
      name: conversation_id
      supportedModules: []
    - defaultValue: "100"
      description: Set this argument to specify how many results to return.
      name: limit
      supportedModules: []
    - description: |
        Lower bound for conversation history (sent to Slack 'oldest' query parameter). Returns messages with time stamp ≥ this value. Accepts Unix timestamp or ISO strings (e.g., "1727448000.000200", "2025-10-12T09:00:00+03:00"). Results are returned in descending order.
      name: from_time
      supportedModules: []
    - description: Token to retrieve the next page of results.
      name: page_token
      supportedModules: []
    - description: The timestamp of the thread for which to retrieve replies. When
        provided, the command behaves like the `slack-get-conversation-replies` command.
      hidden: true
      name: thread_id
      supportedModules: []
    description: Fetches a conversation's history of messages and events.
    name: slack-get-conversation-history
    outputs:
    - contextPath: Slack.Messages.Type
      description: The type of the message (e.g., message, file_share, etc.).
      type: string
    - contextPath: Slack.Messages.Text
      description: The text content of the message.
      type: string
    - contextPath: Slack.Messages.UserId
      description: The user ID of the message sender.
      type: string
    - contextPath: Slack.Messages.Name
      description: The username of the message sender.
      type: string
    - contextPath: Slack.Messages.FullName
      description: The full name of the message sender.
      type: string
    - contextPath: Slack.Messages.TimeStamp
      description: The timestamp of the message.
      type: string
    - contextPath: Slack.Messages.HasReplies
      description: Whether the message has replies.
      type: string
    - contextPath: Slack.Messages.ThreadTimeStamp
      description: The thread timestamp of the message.
      type: string
    - contextPath: SlackConversationHistory.NextPageToken
      description: Token to retrieve the next page of results.
      type: string
    supportedModules: []
  - arguments:
    - description: ID of the channel.
      name: channel_id
      required: true
      supportedModules: []
    - description: The timestamp of the thread, that can be extracted using "slack-get-conversation-history"
        command.
      name: thread_timestamp
      required: true
      supportedModules: []
    - defaultValue: "100"
      description: Set this argument to specify how many results to return.
      name: limit
      supportedModules: []
    description: Retrieves replies to specific messages, regardless of whether it's
      from a public or private channel, direct message, or otherwise.
    name: slack-get-conversation-replies
    supportedModules: []
  - arguments:
    - default: true
      description: 'The message to send to the channel. Use issue fields as variables
        to enrich the text. Example: “${issue.details}”.'
      name: message
      prettyname: Message
      required: true
      supportedModules: []
    - description: The name of the Slack channel to which to send the message.
      name: channel
      prettyname: Channel
      required: true
      supportedModules: []
    description: Sends a message to a user, group, or channel.
    hidden: true
    name: slack-send-notification-quick-action
    outputs:
    - contextPath: Slack.Thread.ID
      description: The Slack thread ID.
      type: String
    prettyname: Send Slack Message
    quickaction: true
    supportedModules: []
  dockerimage: demisto/slackv3:1.0.0.10133006
  isFetchSamples: true
  longRunning: true
  nativeimage:
  - "8.8"
  - "8.6"
  runonce: false
  script: "register_module_line('SlackV3', 'start', __line__())\nCONSTANT_PACK_VERSION
    = '3.8.7'\ndemisto.debug('pack id = Slack, pack version = 3.8.7')\nimport asyncio\nimport
    concurrent\nimport logging.handlers\nimport ssl\nimport re\nimport json\nimport
    threading\nfrom typing import Literal, TypedDict, get_args\nfrom urllib.parse
    import urlparse\nfrom datetime import UTC, datetime\nimport dateparser\nimport
    aiohttp\n\nimport slack_sdk\n\nfrom slack_sdk.errors import SlackApiError\nfrom
    slack_sdk.socket_mode.aiohttp import SocketModeClient\nfrom slack_sdk.socket_mode.request
    import SocketModeRequest\nfrom slack_sdk.socket_mode.response import SocketModeResponse\nfrom
    slack_sdk.web.async_client import AsyncWebClient\nfrom slack_sdk.web.async_slack_response
