        # Logic to determine which API type the current command belongs to
        if command in WEBAPP_COMMANDS:
            api_type = "webapp"
        elif command in DATA_PLATFORM_COMMANDS:
            api_type = "data_platform"
        elif command in APPSEC_COMMANDS:
            api_type = "appsec"
