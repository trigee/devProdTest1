  - arguments:
    - defaultValue: "50"
      description: The maximum number of vulnerabilities to return.
      name: limit
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: LAST_OBSERVED
      description: The field by which to sort the results.
      name: sort_field
      predefined:
      - PLATFORM_SEVERITY
      - CVSS_SCORE
      - EPSS_SCORE
      - CORTEX_VULNERABILITY_RISK_SCORE
      - LAST_OBSERVED
      supportedModules: []
    - auto: PREDEFINED
      defaultValue: DESC
      description: The order in which to sort the results.
      name: sort_order
      predefined:
      - DESC
      - ASC
      supportedModules: []
    - description: The CVE ID. Accepts a comma-separated list.
      isArray: true
      name: cve_id
      supportedModules: []
    - description: The issue ID. Accepts a comma-separated list.
      isArray: true
      name: issue_id
      supportedModules: []
    - description: The minimum CVSS score.
      name: cvss_score_gte
      supportedModules: []
    - description: The minimum EPSS score.
      name: epss_score_gte
      supportedModules: []
    - auto: PREDEFINED
      description: Filter by internet exposed assets.
      name: internet_exposed
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - auto: PREDEFINED
      description: Filter by exploitable vulnerabilities.
      name: exploitable
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - auto: PREDEFINED
      description: Filter by vulnerabilities that have a Known Exploited Vulnerability
        (KEV).
      name: has_kev
      predefined:
      - "true"
      - "false"
      supportedModules: []
    - description: Filter by affected software. Accepts a comma-separated list.
      isArray: true
      name: affected_software
      supportedModules: []
    - description: A comma-separated list of additional fields to retrieve.
      isArray: true
      name: on_demand_fields
      supportedModules: []
    - description: 'The start time for filtering according to case creation time.
        Supports free-text relative and absolute times. For example: 7 days ago, 2023-06-15T10:30:00Z,
        13/8/2025.'
      name: start_time
      supportedModules: []
    - description: 'The end time for filtering according to case creation time. Supports
        free-text relative and absolute times. For example: 7 days ago, 2023-06-15T10:30:00Z,
        13/8/2025.'
      name: end_time
      supportedModules: []
    - auto: PREDEFINED
      description: The severity of the vulnerability issue.
      isArray: true
      name: severity
      predefined:
      - info
      - low
      - medium
      - high
      - critical
      supportedModules: []
    - description: "The email of the user assigned to the vulnerability. Accepts a
        comma-separated list. \nUse 'unassigned' for unassigned vulnerabilities or
        'assigned' for all assigned vulnerabilities.\n"
      isArray: true
      name: assignee
      supportedModules: []
