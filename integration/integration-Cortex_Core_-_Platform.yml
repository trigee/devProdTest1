        def get_incidents(
            self,
            incident_id_list=None,
            lte_modification_time=None,
            gte_modification_time=None,
            lte_creation_time=None,
            gte_creation_time=None,
            status=None,
            starred=None,
            starred_incidents_fetch_window=None,
            sort_by_modification_time=None,
            sort_by_creation_time=None,
            page_number=0,
            limit=100,
            gte_creation_time_milliseconds=0,
            gte_modification_time_milliseconds=None,
            lte_modification_time_milliseconds=None,
        ):
            """
            Filters and returns incidents

            :param incident_id_list: List of incident ids - must be list
            :param lte_modification_time: string of time format "2019-12-31T23:59:00"
            :param gte_modification_time: string of time format "2019-12-31T23:59:00"
            :param lte_creation_time: string of time format "2019-12-31T23:59:00"
            :param gte_creation_time: string of time format "2019-12-31T23:59:00"
            :param starred_incidents_fetch_window: string of time format "2019-12-31T23:59:00"
            :param starred: True if the incident is starred, else False
            :param status: string of status
            :param sort_by_modification_time: optional - enum (asc,desc)
            :param sort_by_creation_time: optional - enum (asc,desc)
            :param page_number: page number
            :param limit: maximum number of incidents to return per page
            :param gte_creation_time_milliseconds: greater than time in milliseconds
            :param gte_modification_time_milliseconds: greater than modification time in milliseconds
            :param lte_modification_time_milliseconds: greater than modification time in milliseconds
            :return:
            """

            search_from = page_number * limit
            search_to = search_from + limit

            request_data = {
                "search_from": search_from,
                "search_to": search_to,
            }

            if sort_by_creation_time and sort_by_modification_time:
                raise ValueError("Should be provide either sort_by_creation_time or sort_by_modification_time. Can't provide both")
            if sort_by_creation_time:
                request_data["sort"] = {"field": "creation_time", "keyword": sort_by_creation_time}
            elif sort_by_modification_time:
                request_data["sort"] = {"field": "modification_time", "keyword": sort_by_modification_time}

            filters = []
            if incident_id_list is not None and len(incident_id_list) > 0:
                filters.append({"field": "incident_id_list", "operator": "in", "value": incident_id_list})

            if status:
                filters.append({"field": "status", "operator": "eq", "value": status})

            if starred and starred_incidents_fetch_window and demisto.command() == "fetch-incidents":
                filters.append({"field": "starred", "operator": "eq", "value": True})
                filters.append({"field": "creation_time", "operator": "gte", "value": starred_incidents_fetch_window})

                if len(filters) > 0:
                    request_data["filters"] = filters
                incidents = self.handle_fetch_starred_incidents(limit, page_number, request_data)
                return incidents

            if starred is not None and demisto.command() != "fetch-incidents":
                filters.append({"field": "starred", "operator": "eq", "value": starred})

            if lte_creation_time:
                filters.append(
                    {"field": "creation_time", "operator": "lte", "value": date_to_timestamp(lte_creation_time, TIME_FORMAT)}
                )

            if gte_creation_time:
                filters.append(
                    {"field": "creation_time", "operator": "gte", "value": date_to_timestamp(gte_creation_time, TIME_FORMAT)}
                )
            elif starred and starred_incidents_fetch_window and demisto.command() != "fetch-incidents":
                # backwards compatibility of starred_incidents_fetch_window
                filters.append({"field": "creation_time", "operator": "gte", "value": starred_incidents_fetch_window})

            if lte_modification_time and lte_modification_time_milliseconds:
                raise ValueError(
                    "Either lte_modification_time or lte_modification_time_milliseconds should be provided . Can't provide both"
                )

            if gte_modification_time and gte_modification_time_milliseconds:
                raise ValueError(
                    "Either gte_modification_time or gte_modification_time_milliseconds should be provide. Can't provide both"
                )

            if lte_modification_time:
                filters.append(
                    {"field": "modification_time", "operator": "lte", "value": date_to_timestamp(lte_modification_time, TIME_FORMAT)}
                )

            if gte_modification_time:
                filters.append(
                    {"field": "modification_time", "operator": "gte", "value": date_to_timestamp(gte_modification_time, TIME_FORMAT)}
                )

            if gte_creation_time_milliseconds:
                filters.append(
                    {"field": "creation_time", "operator": "gte", "value": date_to_timestamp(gte_creation_time_milliseconds)}
                )

            if gte_modification_time_milliseconds:
                filters.append(
                    {"field": "modification_time", "operator": "gte", "value": date_to_timestamp(gte_modification_time_milliseconds)}
                )

            if lte_modification_time_milliseconds:
                filters.append(
                    {"field": "modification_time", "operator": "lte", "value": date_to_timestamp(lte_modification_time_milliseconds)}
                )

            if len(filters) > 0:
                request_data["filters"] = filters

            res = self._http_request(
                method="POST",
                url_suffix="/incidents/get_incidents/",
                json_data={"request_data": request_data},
                headers=self._headers,
                timeout=self.timeout,
            )
            incidents = res.get("reply", {}).get("incidents", [])

            return incidents

        def get_incident_data(
            self, incident_id: str, alerts_limit: int, full_alert_fields: bool = False, remove_nulls_from_alerts: bool = True
        ) -> dict:
            """
            Returns incident extra data by id
            :param incident_id: The id of case
            :param alerts_limit: Maximum number issues to get
            :param full_alert_fields: Whether to return full alert fields
            :return:
            """
            request_data = {
                "incident_id": incident_id,
                "alerts_limit": alerts_limit,
                "full_alert_fields": full_alert_fields,
                "drop_nulls": remove_nulls_from_alerts,
            }

            demisto.debug(f"Calling get_incident_extra_data with {request_data=}.")
            response = self._http_request(
                method="POST",
                url_suffix="/incidents/get_incident_extra_data/",
                json_data={"request_data": request_data},
                headers=self._headers,
                timeout=self.timeout,
            )
            demisto.debug(f"The response of get_incident_extra_data is: {response}.")
            return response.get("reply", {})

        def handle_fetch_starred_incidents(self, limit: int, page_number: int, request_data: Dict[Any, Any]) -> List[Any]:
            """Called from get_incidents if the command is fetch-incidents. Implement in child classes."""
            return []

        def get_endpoints(
            self,
            endpoint_id_list=None,
            dist_name=None,
            ip_list=None,
            public_ip_list=None,
            group_name=None,
            platform=None,
            alias_name=None,
            isolate=None,
            hostname=None,
            page_number=0,
            limit=30,
            first_seen_gte=None,
            first_seen_lte=None,
            last_seen_gte=None,
            last_seen_lte=None,
            sort_by_first_seen=None,
            sort_by_last_seen=None,
            status=None,
            username=None,
        ):
            search_from = page_number * limit
            search_to = search_from + limit

            request_data = {
                "search_from": search_from,
                "search_to": search_to,
            }

            filters = create_request_filters(
                status=status,
                username=username,
                endpoint_id_list=endpoint_id_list,
                dist_name=dist_name,
                ip_list=ip_list,
                group_name=group_name,
                platform=platform,
                alias_name=alias_name,
                isolate=isolate,
                hostname=hostname,
                first_seen_gte=first_seen_gte,
                first_seen_lte=first_seen_lte,
                last_seen_gte=last_seen_gte,
                last_seen_lte=last_seen_lte,
                public_ip_list=public_ip_list,
            )

            if search_from:
                request_data["search_from"] = search_from

            if search_to:
                request_data["search_to"] = search_to

            if sort_by_first_seen:
                request_data["sort"] = {"field": "first_seen", "keyword": sort_by_first_seen}
            elif sort_by_last_seen:
                request_data["sort"] = {"field": "last_seen", "keyword": sort_by_last_seen}

            request_data["filters"] = filters

            response = self._http_request(
                method="POST", url_suffix="/endpoints/get_endpoint/", json_data={"request_data": request_data}, timeout=self.timeout
            )
            endpoints = response.get("reply", {}).get("endpoints", [])
            return endpoints

        def set_endpoints_alias(self, filters: list[dict[str, str]], new_alias_name: str | None) -> dict:  # pragma: no cover
            """
            This func is used to set the alias name of an endpoint.

            args:
                filters: list of filters to get the endpoints
                new_alias_name: the new alias name to set

            returns: dict of the response(True if success else error message)
            """

            request_data = {"filters": filters, "alias": new_alias_name}

            return self._http_request(
                method="POST",
                url_suffix="/endpoints/update_agent_name/",
                json_data={"request_data": request_data},
                timeout=self.timeout,
            )

        def isolate_endpoint(self, endpoint_id, incident_id=None):
            request_data = {
                "endpoint_id": endpoint_id,
            }
            if incident_id:
                request_data["incident_id"] = incident_id

            reply = self._http_request(
                method="POST", url_suffix="/endpoints/isolate", json_data={"request_data": request_data}, timeout=self.timeout
            )
            return reply.get("reply")

        def unisolate_endpoint(self, endpoint_id, incident_id=None):
            request_data = {
                "endpoint_id": endpoint_id,
            }
            if incident_id:
                request_data["incident_id"] = incident_id

            reply = self._http_request(
                method="POST", url_suffix="/endpoints/unisolate", json_data={"request_data": request_data}, timeout=self.timeout
            )
            return reply.get("reply")

        def insert_alerts(self, alerts):
            self._http_request(
                method="POST",
                url_suffix="/alerts/insert_parsed_alerts/",
                json_data={"request_data": {"alerts": alerts}},
                timeout=self.timeout,
            )

        def insert_cef_alerts(self, alerts):
            self._http_request(
                method="POST",
                url_suffix="/alerts/insert_cef_alerts/",
                json_data={"request_data": {"alerts": alerts}},
                timeout=self.timeout,
