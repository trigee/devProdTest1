      - CORTEX_ATTACK_SURFACE_MANAGEMENT
      - CORTEX_ATTACK_SURFACE_TESTING
      - CORTEX_CLI_SCANNER
      - CORTEX_CONTAINER_REGISTRY_SCANNER
      - CORTEX_NETWORK_SCANNER
      - CORTEX_SERVERLESS_FUNCTION_SCANNER
      - QUALYS
      - TENABLE
      supportedModules: []
    - description: The minimum risk score assigned to the vulnerability (range 0-100).
      name: cvrs_gte
      supportedModules: []
    - auto: PREDEFINED
      description: The assessed effectiveness and coverage of detected compensating
        controls.
      isArray: true
      name: compensating_controls_effective_coverage
