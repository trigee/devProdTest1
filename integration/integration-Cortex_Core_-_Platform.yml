    - description: The name of the registry. Accepts a comma-separated list.
      isArray: true
      name: action_registry_name
      supportedModules: []
    - description: The key data of the registry. Accepts a comma-separated list.
      isArray: true
      name: action_registry_key_data
      supportedModules: []
