    description: Retrieves a list of assets (e.g., Repositories, CI/CD Pipelines,
      Container Image Repositories) along with their scan coverage status.
    name: core-get-asset-coverage
    outputs:
    - contextPath: Core.Coverage.Asset.asset_id
      description: The unique ID of the asset. Each asset is assigned a unique identifier
        in the system.
      type: String
    - contextPath: Core.Coverage.Asset.asset_name
      description: The name of the asset. Typically corresponds to the repository,
        container image, or pipeline name.
      type: String
    - contextPath: Core.Coverage.Asset.asset_provider
      description: 'The vendor or source platform of the asset. Indicates where the
        asset originates from. Possible values: AWS, AWS_CODE_BUILD, AWS_CODE_COMMIT,
        AZURE, AZURE_REPOS, BITBUCKET, BITBUCKET_DATACENTER, CIRCLE_CI, DOCKER, GCP,
        GITHUB, GITHUB_ACTIONS, GITHUB_ENTERPRISE, GITLAB, GITLAB_SELF_MANAGED, HCP_TFC_RUN_TASKS,
        HCP_TFE_RUN_TASKS, JENKINS, JFROG_ARTIFACTORY, OCI.'
      type: String
    - contextPath: Core.Coverage.Asset.asset_type
      description: 'The type or category of the asset. Determines the nature of the
        resource being scanned. Possible values: CICD PIPELINE, CONTAINER IMAGE REPOSITORY,
        REPOSITORY.'
      type: String
    - contextPath: Core.Coverage.Asset.business_application_names
      description: A list of business applications associated with the asset. These
        applications help map the asset to business context or ownership.
      type: Array
    - contextPath: Core.Coverage.Asset.is_scanned_by_cicd
      description: 'Indicates whether the asset is scanned within CI/CD pipelines.
        Possible values: ENABLED, DISABLED, IRRELEVANT.'
      type: String
    - contextPath: Core.Coverage.Asset.is_scanned_by_code_weakness
      description: 'Indicates whether code weakness scanning is performed on the asset.
        Possible values: ENABLED, DISABLED, IRRELEVANT.'
      type: String
    - contextPath: Core.Coverage.Asset.is_scanned_by_iac
      description: 'Indicates whether infrastructure-as-code (IaC) scanning is enabled
        for the asset. Possible values: ENABLED, DISABLED, IRRELEVANT.'
      type: String
    - contextPath: Core.Coverage.Asset.is_scanned_by_malware
      description: 'Indicates whether malware scanning is enabled for the asset. Possible
        values: ENABLED, DISABLED, IRRELEVANT.'
      type: String
    - contextPath: Core.Coverage.Asset.is_scanned_by_secrets
      description: 'Indicates whether the asset is scanned for hardcoded secrets or
        credentials. Possible values: ENABLED, DISABLED, IRRELEVANT.'
      type: String
    - contextPath: Core.Coverage.Asset.is_scanned_by_semgrep
      description: 'Boolean flag indicating whether the asset is analyzed using Semgrep
        for code issues or misconfigurations. Possible values: true, false.'
      type: Boolean
    - contextPath: Core.Coverage.Asset.is_scanned_by_sonarqube
      description: 'Boolean flag indicating whether the asset is analyzed using SonarQube
        for code quality and security issues. Possible values: true, false.'
      type: Boolean
    - contextPath: Core.Coverage.Asset.is_scanned_by_veracode
      description: 'Boolean flag indicating whether the asset is scanned using Veracode
        for security vulnerabilities. Possible values: true, false.'
      type: Boolean
    - contextPath: Core.Coverage.Asset.is_scanned_by_vulnerabilities
      description: 'Indicates whether vulnerability scanning is enabled for the asset.
        Possible values: ENABLED, DISABLED, IRRELEVANT.'
      type: String
    - contextPath: Core.Coverage.Asset.last_scan_status
      description: 'The status of the most recent scan performed on the asset. Possible
        values: NOT_SCANNED_YET, ERROR, COMPLETED.'
      type: String
    - contextPath: Core.Coverage.Asset.scanners_data
      description: An array containing detailed information from the scanners that
        evaluated the asset, including scan results, timestamps, and metadata.
      type: Array
    - contextPath: Core.Coverage.Asset.status_coverage
      description: 'The overall scan coverage of the asset. Possible values: FULLY
        SCANNED, PARTIALLY SCANNED, NOT SCANNED.'
      type: String
    - contextPath: Core.Coverage.Asset.unified_provider
      description: 'The unified provider name associated with the asset. Standardized
        across different vendor integrations. Possible values: AWS, AWS_CODE_BUILD,
        AWS_CODE_COMMIT, AZURE, AZURE_PIPELINES, AZURE_REPOS, BITBUCKET, CIRCLE_CI,
        DOCKER, GCP, GITHUB, GITHUB_ACTIONS, GITLAB, GITLAB_CI, HCP_TFC_RUN_TASKS,
        JENKINS, JFROG_ARTIFACTORY, OCI.'
      type: String
    supportedModules: []
  - arguments:
    - description: The unique ID of the issue. Accepts a comma-separated list.
      isArray: true
      name: issue_id
      supportedModules: []
    - auto: PREDEFINED
      description: The severity of the issue. Accepts a comma-separated list.
      isArray: true
      name: severity
      predefined:
      - low
      - medium
      - high
      - critical
      supportedModules: []
    - description: "A custom filter. When using this argument, other filter arguments
        are not relevant. example: \n`{\n                \"OR\": [\n                    {\n
        \                       \"SEARCH_FIELD\": \"actor_process_command_line\",\n
        \                       \"SEARCH_TYPE\": \"EQ\",\n                        \"SEARCH_VALUE\":
        \"path_to_file\"\n                    }\n                ]\n            }`."
      name: custom_filter
      supportedModules: []
    - auto: PREDEFINED
      description: Account type. Accepts a comma-separated list.
      isArray: true
      name: Identity_type
      predefined:
      - ANONYMOUS
      - APPLICATION
      - COMPUTE
      - FEDERATED_IDENTITY
      - SERVICE
      - SERVICE_ACCOUNT
      - TEMPORARY_CREDENTIALS
      - TOKEN
      - UNKNOWN
      - USER
      supportedModules: []
    - description: A unique identifier per agent. Accepts a comma-separated list.
      isArray: true
      name: agent_id
      supportedModules: []
    - description: The hostname to connect to. In case of a proxy connection, this
        value will differ from action_remote_ip. Accepts a comma-separated list.
      isArray: true
      name: action_external_hostname
      supportedModules: []
    - description: A string identifying the user rule. Accepts a comma-separated list.
      isArray: true
      name: rule_id
      supportedModules: []
    - description: The name of the user rule. Accepts a comma-separated list.
      isArray: true
      name: rule_name
      supportedModules: []
    - description: The issue name. Accepts a comma-separated list.
      isArray: true
      name: issue_name
      supportedModules: []
