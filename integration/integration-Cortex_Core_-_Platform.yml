        def get_distribution_url(self, distribution_id, package_type):
            reply = self._http_request(
                method="POST",
                url_suffix="/distributions/get_dist_url/",
                json_data={"request_data": {"distribution_id": distribution_id, "package_type": package_type}},
                timeout=self.timeout,
            )

            return reply.get("reply").get("distribution_url")

        def get_distribution_status(self, distribution_id):
            reply = self._http_request(
                method="POST",
                url_suffix="/distributions/get_status/",
                json_data={"request_data": {"distribution_id": distribution_id}},
                timeout=self.timeout,
            )

            return reply.get("reply").get("status")

        def get_distribution_versions(self):
            reply = self._http_request(method="POST", url_suffix="/distributions/get_versions/", json_data={}, timeout=self.timeout)
            return reply.get("reply")

        def create_distribution(self, name, platform, package_type, agent_version, description):
            request_data = {}
            if package_type == "standalone":
                request_data = {
                    "name": name,
                    "platform": platform,
                    "package_type": package_type,
                    "agent_version": agent_version,
                    "description": description,
                }
            elif package_type == "upgrade":
                request_data = {
                    "name": name,
                    "package_type": package_type,
                    "description": description,
                }

                if platform == "windows":
                    request_data["windows_version"] = agent_version
                elif platform == "linux":
                    request_data["linux_version"] = agent_version
                elif platform == "macos":
                    request_data["macos_version"] = agent_version

            reply = self._http_request(
                method="POST", url_suffix="/distributions/create/", json_data={"request_data": request_data}, timeout=self.timeout
            )

            return reply.get("reply").get("distribution_id")

        def audit_management_logs(
            self, email, result, _type, sub_type, search_from, search_to, timestamp_gte, timestamp_lte, sort_by, sort_order
        ):
            request_data: Dict[str, Any] = {}
            filters = []
            if email:
