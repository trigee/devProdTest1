      isArray: true
      name: dst_action_external_hostname
      supportedModules: []
    - defaultValue: source_insert_ts
      description: The field by which to sort the results.
      name: sort_field
      supportedModules: []
    - auto: PREDEFINED
      description: The order in which to sort the results.
      name: sort_order
      predefined:
      - DESC
      - ASC
      supportedModules: []
    - deprecated: true
      description: This argument is deprecated. Use *page* instead. The first page
        number to retrieve issues from.
      name: offset
      supportedModules: []
    - deprecated: true
      description: This argument is deprecated. Use *page_size* instead. The last
        page number to retrieve issues from.
      name: limit
      supportedModules: []
    - defaultValue: "0"
      description: The page number for the issues to return for pagination.
      name: page
      supportedModules: []
    - defaultValue: "50"
      description: The number of issues to return per page.
      name: page_size
      supportedModules: []
    - description: Supports epoch timestamp, simplified extended ISO format (YYYY-MM-DDThh:mm:ss).
      name: start_time
      supportedModules: []
    - description: Supports epoch timestamp and simplified extended ISO format (YYYY-MM-DDThh:mm:ss).
      name: end_time
      supportedModules: []
    - auto: PREDEFINED
      description: Whether the issue is starred.
