description: "This playbook is designed to handle the following alerts:\n\n- Suspicious
  SaaS API call from a Tor exit node\n- Suspicious SaaS API call from a Tor exit node
  via a mobile device\n- Suspicious API call from a Tor exit node\n- Suspicious Kubernetes
  API call from a Tor exit node\n\nPlaybook Stages:\n\nEarly Containment:\n- To terminate
  the connection from the Tor exit node, the playbook will clear/revoke the user's
  sessions and force re-authentication. Depending on the alert source, the playbook
  will use either MS-Graph or G-Suite to clear the user sessions.\n\nInvestigation:\n-
  The playbook will assess the risk score of the user connected from the Tor exit
  node and examine the legitimacy of the user agent.\n\nContainment:\n- If the user's
  risk score is high or the user agent is detected as suspicious, the playbook will
  recommend blocking the account connected from the Tor exit node. The playbook will
  use MS-Graph, G-Suite, or AWS-IAM, depending on the alert source.\n\nEradication:\n-
  For users with PAN-OS enabled, the playbook will recommend blocking all IPs from
  the Palo Alto Intelligence-based external dynamic list that contains Tor exit nodes.
  The goal is to prevent the use of Tor within the organization.\n\nRequirements:\n\nFor
  any response action, you will need one of the following integrations: \n- Microsoft
  Graph User\n- G-Suite Admin\n- AWS-IAM."
