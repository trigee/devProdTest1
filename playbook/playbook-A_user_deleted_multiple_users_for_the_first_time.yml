            Alerts**\nDetected Related Alerts: `${.=val.Evidence && val. Evidence.RelatedAlerts
            ? \"Alerts found for the user\" : \"Alerts not found\"}`\n\n---\n\n###
            Deleted Users\n\n${Core.OriginalAlert=val._all_events.map(e => e.normalized_evtlog_target_user).filter((v,
