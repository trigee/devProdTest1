description: Triages a suspicious URL by performing visual screenshot, sandboxing,
  and multi-source reputation checks, then auto-blocks or escalates for analyst review
  based on configured thresholds.
dirtyInputs: true
id: 80d46aad-bfe2-4edd-8cf5-ed9e89a300e0
inputSections:
- description: Configure triage, reputation, screenshot, and automated response options.
  inputs:
  - URL
  - ReputationSource
  - DetonationEnabled
  - ScreenshotEnabled
  - AutoBlockThreshold
  - AnalystEscalationEmail
  - EnrichmentTimeout
  name: Configuration Settings
inputs:
- description: The URL to triage and investigate.
  key: URL
  playbookInputQuery: null
  required: true
  value:
    simple: ${alert.url}
- description: 'Reputation source: VirusTotal, URLScan, or Built-In'
  key: ReputationSource
  playbookInputQuery: null
  required: true
  value:
    simple: VirusTotal
- description: Enable WildFire sandboxing detonation (true/false).
  key: DetonationEnabled
  playbookInputQuery: null
  required: true
  value:
    simple: "true"
- description: Enable rendering a page screenshot using Rasterize (true/false).
  key: ScreenshotEnabled
  playbookInputQuery: null
  required: true
  value:
    simple: "true"
- description: DBotScore threshold to auto-block URL (1=Good, 2=Suspicious, 3=Malicious).
  key: AutoBlockThreshold
  playbookInputQuery: null
  required: true
  value:
    simple: "3"
- description: Email of the analyst to receive inconclusive triages.
  key: AnalystEscalationEmail
  playbookInputQuery: null
  required: true
  value:
    simple: admin@example.com
- description: Timeout in seconds for detonation and enrichment.
  key: EnrichmentTimeout
  playbookInputQuery: null
  required: true
  value:
    simple: "900"
