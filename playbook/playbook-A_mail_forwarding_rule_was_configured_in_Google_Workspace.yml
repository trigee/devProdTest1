description: "This playbook addresses the following alerts:\n\n- A mail forwarding
  rule was configured in Google Workspace.\n- A mail forwarding rule was configured
  in Google Workspace to an uncommon domain.\n\nPlaybook Stages:\n \nTriage: \n\n-
  The playbook retrieves the caller's IP, the forwarding email address, and associated
  filters.\n\nEarly Containment:\n\n- The playbook checks if the IP or domain of the
  forwarding email address is malicious. If so, it suggests blocking the IP using
  PAN-OS while continuing the investigation in parallel.\n\nInvestigation:\n\n- The
  playbook verifies if the rule was created outside of working hours or from an unusual
  geolocation and extracts suspicious keywords from the forwarding rules. It then
  aggregates all evidence collected during the investigation.\n\nContainment:\n\n-
  If only one suspicious evidence is found, the playbook executes soft response actions,
  including signing the user out and deleting the forwarding email address from the
  user account mailbox. The user will be notified of these actions via email.\n- If
  multiple suspicious evidences are found, the playbook executes both soft and hard
  response actions, recommending the analyst suspend the user account.\n\nRequirements:
  \n\nFor any response action, you need one of the following integrations:\n- Gmail
  integration to fetch filters and remove the forwarding email address.\n- Google
  Workspace Admin access to sign out and suspend the user account.\n"
