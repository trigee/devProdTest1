            || \"None\"}`\n\n---\n\n### Source User Risk Analysis:\n- **User is risky**:
            `${.=val.UserIsRisky ? \"Yes, Reason: \" + val.UserRiskyCoreReason : \"N/A\"}`\n\n---\n###
