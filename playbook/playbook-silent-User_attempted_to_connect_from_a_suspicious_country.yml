      description: "The evidence from the investigation is insufficient for an automatic
        remediation. This may have been caused by errors and/or lack of evidence.\n\nReview
        the alert's details, the evidence and errors gathered by the playbook. Then
        take the appropriate actions to close this alert.\n\n\n**User:** ${Core.OriginalAlert.event.auth_identity}\n\n**Authentication
        System:** ${Core.OriginalAlert.raw_abioc.event.auth_server}\n\n**Source Country:**
        ${Core.OriginalAlert.event.action_country}\n\n### Evidence found:\n${.=((function()
        { var e = val.Evidence ? [].concat(val.Evidence) : []; var f = e.filter(x
        => x.Comment && x.Comment.length > 0); return f.length > 0 ? f.map(item =>
        \"1. +\" + item.Name.replace(/_/g, \" \").replace(/\\b\\w+\\b/g, (w) => [\"IP\",
        \"DC\", \"CA\", \"DNS\", \"AI\", \"SMB\", \"XQL\", \"ID\", \"URL\", \"CVE\",
        \"MITRE\", \"OS\", \"RDP\", \"SSH\", \"WMI\", \"VNC\", \"TOR\", \"DLL\", \"MD5\",
        \"SHA1\", \"SHA256\", \"HTTP\", \"HTTPS\", \"TCP\", \"UDP\", \"ICMP\", \"URI\",
        \"AD\", \"SID\", \"GUID\", \"UUID\", \"MAC\", \"VM\", \"API\", \"JSON\", \"XML\",
        \"ISP\", \"AWS\", \"GCP\", \"EXE\", \"MSI\", \"BAT\"].includes(w.toUpperCase())
        ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        + \"+ - \" + item.Comment).join(\"\\n\") : \"  No Evidence Found.\"; })())}\n\n###
        Investigation Errors:\n${.=((function() { var e = val.Errors? [].concat(val.Errors)
        : []; var f = e.filter(x => x.Comment && x.Comment.length > 0); return f.length
        > 0 ? f.map(item => \"1. +\" + item.Name.replace(/_/g, \" \").replace(/\\b\\w+\\b/g,
        (w) => [\"IP\", \"DC\", \"CA\", \"DNS\", \"AI\", \"SMB\", \"XQL\", \"ID\",
        \"URL\", \"CVE\", \"MITRE\", \"OS\", \"RDP\", \"SSH\", \"WMI\", \"VNC\", \"TOR\",
        \"DLL\", \"MD5\", \"SHA1\", \"SHA256\", \"HTTP\", \"HTTPS\", \"TCP\", \"UDP\",
        \"ICMP\", \"URI\", \"AD\", \"SID\", \"GUID\", \"UUID\", \"MAC\", \"VM\", \"API\",
        \"JSON\", \"XML\", \"ISP\", \"AWS\", \"GCP\", \"EXE\", \"MSI\", \"BAT\"].includes(w.toUpperCase())
        ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        + \"+ - \" + item.Comment).join(\"\\n\") : \"  No Errors Found.\"; })())}\n\n###
        Manual Remediation Steps\nIf you find this alert malicious. we recommend taking
        these steps to ensure full remediation:\n\n**Immediate Actions:** Terminate
        any active user sessions in your authentication system to prevent continued
        access from the suspicious location. Reset the user's password and invalidate
        any existing authentication tokens or refresh tokens.\n        \n**Access
        Controls:** Temporarily disable the user account or implement conditional
        access policies to block connections from the suspicious country or IP range
        until the alert can be fully investigated and verified.\n        \n**MFA Enforcement:**
        Ensure multi-factor authentication is enabled and properly configured for
        the user. Consider requiring re-enrollment of MFA devices if there are concerns
        about device compromise."
