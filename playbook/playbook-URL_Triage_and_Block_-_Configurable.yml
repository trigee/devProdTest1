description: Triages a suspicious URL by performing reputational checks (via VirusTotal,
  URLScan, or built-in threat intel), sandboxing detonation, webpage screenshot rendering,
  auto-blocking malicious URLs, and escalating inconclusive results to an on-call
  analyst for manual review.
id: 884bf000-e9d8-432b-8112-df606a876f8a
inputSections:
- description: Configure URL triage options.
  inputs:
  - URL
  - ReputationSource
  - Detonation
  - Screenshot
  - AutoBlockThreshold
  - EnrichmentTimeout
  name: URL Investigation Options
inputs:
- description: The URL to triage.
  key: URL
  playbookInputQuery: null
  required: true
  value:
    simple: ${alert.url}
- description: 'Reputation source: VirusTotal, URLScan, or built-in threat intel.'
  key: ReputationSource
  playbookInputQuery: null
  required: false
  value:
    simple: Built-in threat intel
- description: Whether to submit the URL to a sandbox and wait for the report (true/false).
  key: Detonation
  playbookInputQuery: null
  required: false
  value:
    simple: "false"
- description: Whether to render the page and attach an image to the incident (true/false).
  key: Screenshot
  playbookInputQuery: null
  required: false
  value:
    simple: "false"
- description: The minimum malicious score that triggers an automatic block.
  key: AutoBlockThreshold
  playbookInputQuery: null
  required: false
  value:
    simple: "3"
- description: How long to wait for enrichment before proceeding (in seconds).
  key: EnrichmentTimeout
  playbookInputQuery: null
  required: false
  value:
    simple: "300"
name: URL Triage and Block - Configurable
