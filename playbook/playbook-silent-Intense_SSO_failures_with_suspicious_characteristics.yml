            ? \"Yes\" : \"No\"}`\n\n### **Users Risk Analysis:**\n**Azure:**\n${.=val.UserRiskyAzureDetections
            && val.UserRiskyAzureDetections.length > 0 ? val.UserRiskyAzureDetections.map(user
            => \"- **User:** \" + user.UPN + \"\\n  - **Risk Types:** \" + user.RiskTypes).join(\"\\n\\n\")
            : \"No risky users detected.\"}\n\n**Core:** \n${.=val.UserRiskyCoreReason
            && val.UserRiskyCoreReason.length > 0 ? val.UserRiskyCoreReason.map(user
            => \"- **User ID:** \" + user.UserID + \"\\n  - **Risk Reasons:** \" +
            user.Reasons).join(\"\\n\\n\") : \"No risk reasons found.\"}\n\n### **Users
            Azure Security Alerts**\n${.=val.AzureSecurityAlerts && val.AzureSecurityAlerts.length
            > 0 ? val.AzureSecurityAlerts.map(alert => \"- **User:** \" + alert.AccountUpn
            + \"\\n  - **Alerts:** \" + alert.Titles).join(\"\\n\\n\") : \"No security
            alerts found.\"}\n\n### **Pattern Likelihood Analysis**\n- **Is the attack
            pattern likely automated?** `${.=val.IntervalAnalysis.IsPatternLikelyAutomated
            === true ? \"**Yes**\" : \"**No**\"}`\n\n### **Related Alerts**\n${.=val.foundIncidents
            && val.foundIncidents.length > 0 ? \"#### \U0001F50D Related Alerts:\\n\\n\"
            + Array.from(new Set(val.foundIncidents.map(alert => \"- \" + alert.name))).join(\"\\n\\n\")
            : \"No related alerts found.\"}\n\n### **Admin App Target Found**\n- **Was
            an admin app targeted?** \n`${.=Array.isArray(val.Core.OriginalAlert._all_events)
            ? (foundApps = val.Core.OriginalAlert._all_events.map(event => event.auth_target).filter(app
            => [\"Azure portal\", \"Exchange admin center\", \"Microsoft 365 admin
            center\", \"Microsoft 365 Defender portal\", \"Microsoft Entra admin center\",
            \"Microsoft Intune admin center\", \"Microsoft Purview compliance portal\",
            \"Microsoft Teams admin center\"].includes(app)), uniqueApps = foundApps.filter((app,
            index, self) => self.indexOf(app) === index), uniqueApps.length > 0 ?
