            && val.foundIncidents.length > 0 ? Array.from(new Set(val.foundIncidents.map(alert
            => \"- \" + alert.name))).join(\"\\n\\n\") : \"No related alerts found.\"}\n\n###
            **Other Information**\n**High Uncommon Apps Ratio?**:\n${.=val.UncommonAppsRatio
            != null && val.UncommonAppsRatio >= 0.8 ? \"Yes, \" + (Math.round(val.UncommonAppsRatio
            * 10000) / 100).toFixed(2) + \"%\" : \"No\"}\n\n**Sign-in Deviation Unusual
            App Count**: ${Core.OriginalAlert=(val.event && val.stateful_raw_data
