description: "This playbook addresses the following alerts:\n\n- External Exchange
  inbox forwarding rule configured.\n- Suspicious Exchange inbox forwarding rule configured.\n-
  Suspicious Exchange email-hiding inbox rule.\n- Possible BEC Exchange email-hiding
  inbox rule.\n- Exchange email-hiding transport rule based on message keywords.\n-
  Suspicious Exchange email-hiding transport rule.\n- Exchange transport forwarding
  rule configured.\n- Suspicious Exchange transport forwarding rule configured.\n\nPlaybook
  Stages:\n \nTriage: \n\n- The playbook retrieves the caller's IP, the forwarding
  email address, and the domain.\n\nEarly Containment:\n\n- The playbook checks if
  the IP or domain of the forwarding email address is malicious. If so, it suggests
  blocking the IP using PAN-OS while continuing the investigation in parallel.\n\nInvestigation:\n\n-
  The playbook checks for suspicious behaviors, including whether an Exchange admin
  created the rule outside of working hours, from unusual geolocation, or if the user
  who created the rule has a high-risk score. It then aggregates all evidence collected
  during the investigation.\n\nContainment:\n\n- Soft Response Actions: If at least
  two suspicious pieces of evidence are identified, the playbook will execute soft
  response actions. These actions include signing the user out and disabling the forwarding
  rule configured in the user's account mailbox.\n- Hard Response Actions: If more
  than two suspicious pieces of evidence are identified, the playbook escalates to
  hard response actions. These actions include disabling the user account upon analyst
  decision and removing the forwarding rule from the user's account mailbox.\n\nRequirements:
  \n\nFor any response action, you need the following integrations:\n- EWS Extension
  Online Powershell v3 integration.\n- Azure Active Directory Users."
