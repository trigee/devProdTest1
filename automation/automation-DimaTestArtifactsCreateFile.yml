script: |+
  import random
  import string

  # Consts
  RANDOM_STR_MIN_LENGTH = 10
  RANDOM_STR_MAX_LENGTH = 256

  # Methods

  def create_random_string() -> str:
      random_string = "Randomly generated:\n\n"
      letters = string.ascii_lowercase
      random_string += ''.join(random.choice(letters) for _ in range(random.randint(RANDOM_STR_MIN_LENGTH, RANDOM_STR_MAX_LENGTH)))

      return random_string

  #######  Create File  #######

  def main():
      file_name = demisto.args().get("filename")
      user_content = demisto.args().get("content")
      file_content = user_content if user_content is not None else create_random_string()

      try:
          return_results(fileResult(file_name, file_content))
      except Exception as exc:
          demisto_error(f"Fie was not created:\n{exc}")

  if __name__ in ('__main__', '__builtin__', 'builtins'):
      main()

