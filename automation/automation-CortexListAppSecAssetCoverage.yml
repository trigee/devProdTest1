comment: Retrieves Application Security Posture Management (ASPM) coverage information
  for assets, including scan status across different security scanning types (vulnerabilities,
  secrets, code weakness, IaC, malware, CICD). Returns coverage statistics, histograms,
  and detailed asset information. Filters can be provided to return a subset of the
  results. Statistics are generated over the filtered set.
