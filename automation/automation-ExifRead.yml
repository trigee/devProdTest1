dockerimage: demisto/py3-tools:1.0.0.10120494
enabled: true
engineinfo: {}
mainengineinfo: {}
name: ExifRead
nativeimage:
- "8.8"
- "8.6"
outputs:
- contextPath: Exif.tag
  description: Exif tag name.
  type: string
- contextPath: Exif.value
  description: Exif tag value.
  type: string
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('ExifRead', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.49'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.49')

  import exifread



  def get_exif_tags(file_entry_id):
      res = demisto.getFilePath(file_entry_id)
      f = open(res["path"], "rb")

      tags = exifread.process_file(f)  # pylint: disable=E1101
      arr = []
      for tag in tags:
          arr.append({"tag": str(tag), "value": str(tags[tag])})

      md = tableToMarkdown("Exif Tags", arr)

      demisto.results(
          {
              "ContentsFormat": formats["json"],
              "Type": entryTypes["note"],
              "Contents": {"Exif": arr},
              "HumanReadable": md,
              "EntryContext": {"Exif": arr},
          }
      )


  def main():
      file_entry_id = demisto.args()["EntryID"]
      get_exif_tags(file_entry_id)


  # python2 uses __builtin__ python3 uses builtins
  if __name__ == "__builtin__" or __name__ == "builtins":
      main()

  register_module_line('ExifRead', 'end', __line__())
scripttarget: 0
