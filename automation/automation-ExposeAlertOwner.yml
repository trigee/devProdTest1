comment: Expose the alert owner into AlertOwner context key
commonfields:
  id: ExposeAlertOwner
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 5.0.0
    isoverridable: false
    itemVersion: 1.22.45
    packID: CommonScripts
    packName: Common Scripts
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    supportedModules: []
    toServerVersion: ""
enabled: true
engineinfo: {}
mainengineinfo: {}
name: ExposeAlertOwner
outputs:
- contextPath: IncidentOwner.name
  description: Alert owner full name
- contextPath: IncidentOwner.email
  description: Alert owner email address
- contextPath: IncidentOwner.phone
  description: Alert owner phone number
- contextPath: IncidentOwner.roles
  description: Alert owner roles
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  // pack version: 1.22.45
  var owner = incidents[0].owner;
  owner = owner.replace(/\\/g,'\\\\');
  var users = executeCommand('getUsers', {});
  var ownerJSON = dq(users,'Contents(val.username==="' + owner + '")');
  if (ownerJSON) {
      setContext('IncidentOwner',ownerJSON);
      return 'Incident owner set in IncidentOwner context key';
  } else {
      return 'Incident has no owner';
  }
scripttarget: 0
