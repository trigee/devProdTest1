    toServerVersion: ""
dockerimage: demisto/python3:3.12.13.10404775
enabled: true
engineinfo: {}
mainengineinfo: {}
name: AddDBotScoreToContext
nativeimage:
- "8.8"
- "8.6"
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('AddDBotScoreToContext', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.45'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.45')




  def main():
      indicator = demisto.args().get("indicator")
      indicatorType = demisto.args().get("indicatorType")
      score = int(demisto.args().get("score"))
      vendor = demisto.args().get("vendor")
      reliability = demisto.args().get("reliability", None)

      dbotscore = {"Indicator": indicator, "Type": indicatorType, "Vendor": vendor, "Score": score, "Reliability": reliability}

      command_results = CommandResults(outputs_prefix="DBotScore", outputs=dbotscore)
      return_results(command_results)


  if __name__ == "__builtin__" or __name__ == "builtins":
      main()

  register_module_line('AddDBotScoreToContext', 'end', __line__())
