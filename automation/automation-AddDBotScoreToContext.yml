args:
- description: The indicator value (ex 1.1.1.1).
  name: indicator
  required: true
  supportedModules: []
- description: The indicator type (ex ip, url, email, domain).
  name: indicatorType
  required: true
  supportedModules: []
- description: The indicator score.
  name: score
  required: true
  supportedModules: []
- description: The vendor to assign to this DBotScoreEntry.
  name: vendor
  required: true
  supportedModules: []
- auto: PREDEFINED
  description: The reputation reliability.
  name: reliability
  predefined:
  - A+ - 3rd party enrichment
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
  supportedModules: []
comment: Add DBot score to context for indicators with custom vendor, score, reliability,
  and type.
commonfields:
  id: AddDBotScoreToContext
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
