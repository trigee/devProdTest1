script: |
  register_module_line('enrich_exclude_button', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.44'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.44')




  def main():
      return_error("\nThis indicator is enrich excluded")


  """ ENTRY POINT """
  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('enrich_exclude_button', 'end', __line__())
