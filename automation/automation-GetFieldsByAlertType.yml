args:
- description: The alert type for which to return alert field names.
  name: incident_type
  required: true
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: Whether to shorten the alert field names. If "true", will cause output
    to use shortened field names. The default value is "false".
  name: short_names
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: Whether to only return non-system fields. If "true", will only output
    non-system fields. The default value is "false".
  name: exclude_system
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: Whether to only include fields that are explicitly associated to the
    alert type. If "true", only fields which are explicitly associated to the alert
    type will be included (i.e., excludes fields for which the "associate to any"
    checkbox is selected). The default value is "false".
  name: explicit_only
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "true"
  description: Pretty-prints the output.
  name: pprint
