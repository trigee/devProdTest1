args:
- description: Additional text by which to query incidents.
  name: query
  supportedModules: []
- description: A comma-separated list of incident types by which to filter.
  name: incidentTypes
  supportedModules: []
- description: 'The start date by which to filter incidents. Date format will be the
    same as in the incidents query page, for example: "3 days ago", ""2019-01-01T00:00:00
    +0200").'
  name: fromDate
  supportedModules: []
- description: 'The end date by which to filter incidents. Date format will be the
    same as in the incidents query page, for example: "3 days ago", ""2019-01-01T00:00:00
    +0200").'
  name: toDate
  supportedModules: []
- defaultValue: "500"
  description: The maximum number of incidents to fetch.
  name: limit
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  deprecated: true
  description: Deprecated due to performance considerations. Rather than using this
    argument, it is recommended to retrieve the context of the incidents separately,
    preferably for a limited number of incidents.
  name: includeContext
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  defaultValue: created
  description: The incident field to specify for the date range. Can be "created"
    or "modified". The default is "created". Due to performance considerations, you
    should only use "modified" if you have a large number of incidents.
  name: timeField
  predefined:
  - created
  - modified
  supportedModules: []
- description: A comma-separated list of non-empty value incident field names by which
    to filter incidents.
  name: NonEmptyFields
  supportedModules: []
- auto: PREDEFINED
  defaultValue: pickle
  description: The output file format.
  name: outputFormat
  predefined:
  - json
  - pickle
  supportedModules: []
- description: A comma-separated list of fields in the object to poplulate.
  name: populateFields
  supportedModules: []
- defaultValue: "100"
  description: Incidents query batch size.
  name: pageSize
  supportedModules: []
