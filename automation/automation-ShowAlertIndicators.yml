comment: |-
  This script is used to display the indicators of an alert in an alert field of type Array. It can be used to select indicators from the alert in order to later perform some actions, like tagging the indicators for blocking via EDL.
  This script is a field-display script, so it needs to be configured as such, when editing the alert field that will be used to display the indicators.
