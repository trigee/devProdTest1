args:
- description: A unique name for the AppSec policy. Must be descriptive and follow
    organizational naming conventions.
  name: policy_name
  required: true
  supportedModules: []
- description: A detailed explanation of the policy's objective, use case, and expected
    outcomes.
  name: description
  supportedModules: []
- description: Comma-separated list of Asset Group names to apply the policy to. Asset
    groups will be automatically resolved to their corresponding IDs.
  isArray: true
  name: asset_group_names
  supportedModules: []
- description: 'Filter by specific finding types to target policy enforcement. Supported
    values: Vulnerabilities, IaC Misconfiguration, Licenses, Operational Risk, Secrets,
    Code Weaknesses, CI/CD Risks, Drift, Malware. Also accepts raw API values: VULNERABILITY,
    IAC_MISCONFIGURATION, LICENSES, OPERATIONAL_RISK, SECRETS, CODE_WEAKNESS, CICD_RISKS,
    DRIFT, MALWARE.'
  isArray: true
  name: conditions_finding_type
  supportedModules: []
- description: 'Filter findings by severity level to prioritize policy actions. Supported
    values: CRITICAL, HIGH, MEDIUM, LOW.'
  isArray: true
  name: conditions_severity
  supportedModules: []
- auto: PREDEFINED
  description: Controls whether a developer's manual suppression should be honored.
    Set to 'true' to respect developer suppression (evaluate only non-suppressed findings).
    Set to 'false' to ignore suppression and always evaluate the finding.
  name: conditions_respect_developer_suppression
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Filter findings based on their backlog workflow status (NEW or BACKLOG).
  name: conditions_backlog_status
  predefined:
  - NEW
  - BACKLOG
  supportedModules: []
- description: Target specific software packages by name for license or vulnerability
    policies.
  name: conditions_package_name
  supportedModules: []
- description: Specify software package version constraints for precise policy targeting.
  name: conditions_package_version
  supportedModules: []
- description: 'Filter packages by their operational risk assessment level. Supported
    values: HIGH, MEDIUM, LOW.'
  name: conditions_package_operational_risk
  supportedModules: []
- description: Comma-separated list of AppSec rule names to include in policy evaluation.
    Rule names will be automatically resolved to their corresponding IDs.
  isArray: true
  name: conditions_appsec_rule_names
  supportedModules: []
- description: Filter findings by AppSec rule category. Applies to SECRETS and IAC_MISCONFIGURATION
    and CI/CD Risk and Drift finding types.
  isArray: true
  name: conditions_appsec_rule_category
  supportedModules: []
- description: CVSS base score threshold for vulnerability findings (0.0-10.0). Only
    vulnerabilities meeting or exceeding this score will trigger the policy.
  name: conditions_cvss
  supportedModules: []
- description: Exploit Prediction Scoring System score threshold (0-100). Targets
    vulnerabilities with higher exploitation probability.
  name: conditions_epss
  supportedModules: []
- auto: PREDEFINED
  description: 'Filter vulnerability findings by CVSS severity category. Supported
    values: Critical, High, Medium, Low.'
  isArray: true
  name: conditions_cvss_severity
  predefined:
  - Critical
  - High
  - Medium
  - Low
  supportedModules: []
- auto: PREDEFINED
  description: Filter findings based on whether a remediation fix or patch is available.
  name: conditions_has_a_fix
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Target findings listed in CISA's Known Exploited Vulnerabilities (KEV)
    catalog for prioritized remediation.
  name: conditions_is_kev
  predefined:
  - "true"
  - "false"
  supportedModules: []
- description: Filter vulnerability findings by risk factors (e.g. internet exposure,
    privilege escalation). Applies to VULNERABILITY finding type.
  isArray: true
  name: conditions_risk_factors
  supportedModules: []
- description: 'Filter exposed secrets by their validity status. Supported values:
    VALID (active secrets), PRIVILEGED (high-access secrets), INVALID (expired/revoked),
    UNAVAILABLE (status unknown).'
  isArray: true
  name: conditions_secret_validity
  supportedModules: []
- description: Target specific software license types for compliance and legal risk
    management.
  isArray: true
  name: conditions_license_type
  supportedModules: []
- auto: PREDEFINED
  description: 'Filter findings by license category. Supported values: Weak copyleft,
    Strong copyleft, Non permissive. Applies to LICENSES finding type.'
  isArray: true
  name: conditions_license_category
  predefined:
  - Weak copyleft
  - Strong copyleft
  - Non permissive
  supportedModules: []
- description: 'Define asset categories to include in policy scope. Supported values:
    Application, Repository, CI/CD Instance, CI/CD Pipeline, VCS Collaborator, VCS
    Organization.'
  isArray: true
  name: scope_category
  supportedModules: []
- description: Target specific business applications by name for focused policy enforcement.
  isArray: true
  name: scope_business_application_names
  supportedModules: []
- description: 'Filter applications by business criticality level. Supported values:
    CRITICAL, HIGH, MEDIUM, LOW.'
  isArray: true
  name: scope_application_business_criticality
  supportedModules: []
- description: Target specific code repositories by name for repository-focused policies.
  isArray: true
  name: scope_repository_name
  supportedModules: []
- auto: PREDEFINED
  description: Filter repositories based on their visibility (public vs private) for
    exposure risk management.
  name: scope_is_public_repository
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Target repositories or applications that have associated deployed infrastructure
    or runtime assets.
  name: scope_has_deployed_assets
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Filter assets based on whether the deployed components are exposed
    to internet traffic for external attack surface management.
  name: scope_has_internet_exposed_deployed_assets
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Target deployed assets that have access to sensitive data stores, databases,
    or classified information.
  name: scope_has_sensitive_data_access
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Filter deployed assets with elevated privileges, admin access, or high-impact
    system capabilities.
  name: scope_has_privileged_capabilities
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Enables detection during scheduled scans. When a violation is found
    in a periodic scan, an issue will be created ("Detect").
  name: triggers_periodic_report_issue
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Override the default severity level for issues created by periodic
    scan detections.
  name: triggers_periodic_override_severity
  predefined:
  - Critical
  - High
  - Medium
  - Low
  supportedModules: []
- auto: PREDEFINED
  description: Enables detection during pull request scans. When a violation is found
    in a PR, an issue is created. Required for PR-based detection.
  name: triggers_pr_report_issue
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Blocks merging of pull requests that contain violations detected by
    the policy.
  name: triggers_pr_block_pr
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Adds an automated comment to pull requests summarizing detected violations
    and guidance.
  name: triggers_pr_report_pr_comment
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Override the default severity level for issues created by pull request
    detections.
  name: triggers_pr_override_severity
  predefined:
  - Critical
  - High
  - Medium
  - Low
  supportedModules: []
- auto: PREDEFINED
  description: Enables detection during CI/CD pipeline scans. When a violation is
    found in a pipeline run, an issue is created.
  name: triggers_cicd_report_issue
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Blocks or fails CI/CD pipeline runs when violations occur.
  name: triggers_cicd_block_cicd
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Reports violation details back to the CI/CD system (pipeline logs,
    dashboards, status checks).
  name: triggers_cicd_report_cicd
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Override the default severity level for issues created by CI/CD pipeline
    detections.
  name: triggers_cicd_override_severity
  predefined:
  - Critical
  - High
  - Medium
  - Low
  supportedModules: []
- auto: PREDEFINED
  description: Enables detection during CI image scans. When a violation is found,
    an issue is created.
  name: triggers_ci_image_report_issue
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Blocks or fails CI pipeline runs when violations are detected in container
    images.
  name: triggers_ci_image_block_cicd
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Reports violation details back to the CI system when detected in container
    images.
  name: triggers_ci_image_report_cicd
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Override the default severity level for issues created by CI image
    detections.
  name: triggers_ci_image_override_severity
  predefined:
  - Critical
  - High
  - Medium
  - Low
  supportedModules: []
- auto: PREDEFINED
  description: Enables detection during image registry scans. When a violation is
    found, an issue is created.
  name: triggers_image_registry_report_issue
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  description: Override the default severity level for issues created by image registry
    detections.
  name: triggers_image_registry_override_severity
  predefined:
  - Critical
  - High
  - Medium
  - Low
  supportedModules: []
- description: The ID of a policy suggestion to associate with this policy. When provided,
    links the created policy to the AI-generated suggestion it was based on.
  name: suggestion_id
  supportedModules: []
comment: |
  Creates a new AppSec policy in Cortex Platform with defined conditions, scope, and triggers for application security governance.
  Supports all finding types (Vulnerabilities, Secrets, IaC Misconfiguration, Licenses, Operational Risk, Weaknesses, CI/CD Risk, Drift, Malware),
  full scope filtering, and all five trigger types (periodic, PR, CI/CD, CI image, image registry).
