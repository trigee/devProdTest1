name: GenerateSummaryReportButton
nativeimage:
- "8.8"
- "8.6"
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('GenerateSummaryReportButton', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.44'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.44')



  # get incident id
  incident_id = demisto.incidents()[0].get("id")

  # generate the Case Report
  demisto.results(
      demisto.executeCommand("generateSummaryReport", {"incidentId": incident_id, "name": "Case Report", "type": "pdf"})
  )

  register_module_line('GenerateSummaryReportButton', 'end', __line__())
