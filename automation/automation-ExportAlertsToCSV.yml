args:
- description: The query for the Alerts that you want to export. (e.g. status:closed
    -category:job). You can and should generate the query from the Alerts search screen.
  name: query
  required: true
  supportedModules: []
- defaultValue: "7"
  description: Number of days you want to fetch back for (default is 7).  Needs to
    be a number.
  name: fetchdays
  supportedModules: []
- description: 'Comma separated list of columns (fields) for the CSV.  (Default is:
    id,name,type,severity,status,owner,roles,playbookId,occurred,created,modified,closed).'
  name: columns
  supportedModules: []
comment: This automation uses the Core REST API Integration to batch export Alerts
  to CSV and return the resulting CSV file to the war room.
