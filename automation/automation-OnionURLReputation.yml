args:
- description: The indicators to which to add the reputation.
  isArray: true
  name: input
  required: true
  supportedModules: []
comment: This script adds the reputation to Onion URL indicators. The script is automatically
  triggered when a Onion URL indicator is auto-extracted. For instance, if you run
  a Cortex CLI on a valid Onion URL, the indicators are extracted automatically and
  this script is triggered for the extracted indicators.
commonfields:
  id: OnionURLReputation
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 5.0.0
    isoverridable: false
    itemVersion: 1.22.28
    packID: CommonScripts
    packName: Common Scripts
    packPropagationLabels:
