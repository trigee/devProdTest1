    toServerVersion: ""
dockerimage: demisto/python3:3.12.13.10116658
enabled: true
engineinfo: {}
mainengineinfo: {}
name: OnionURLReputation
nativeimage:
- "8.8"
- "8.6"
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('OnionURLReputation', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.28'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.28')




  def main():
      url_list = argToList(demisto.args().get("input"))
      entry_list = []

      for url in url_list:
          entry_list.append(
              {
                  "Type": entryTypes["note"],
                  "ContentsFormat": formats["json"],
                  "Contents": 2,
                  "EntryContext": {
                      "DBotScore": {
                          "Indicator": url,
                          "Type": "Onion URL",
                          "Score": 2,  # suspicious
                          "Vendor": "DBot",
                      }
                  },
              }
          )

      demisto.results(entry_list)


  if __name__ in ("__main__", "builtin", "builtins"):
      main()

  register_module_line('OnionURLReputation', 'end', __line__())
scripttarget: 0
signature: 
subtype: python3
