args:
- description: |
    Accepts a list of domains to enrich.
    - From CLI: Provide a comma-separated list.
      If a Domain contains a comma, wrap the domains in a JSON array.
      Example: "[\"example.com/search:yellow,red\", \"example2.com\"]".
    - From Context: Pass JSON arrays directly, without modification.
  isArray: true
  name: domain_list
  required: true
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: 'Whether to call external integrations for enrichment: - ''true'':
    enrich using enabled external integrations (e.g., VirusTotal (API v3), AlienVault
    OTX v2) and run internal commands. - ''false'': use only existing Threat Intel
    data and run internal commands; skip external integrations. If the ''brands''
    argument is provided, this flag is ignored and enrichment/internal commands will
    run only on the brands provided.'
  name: external_enrichment
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: Retrieve a human-readable entry for each command; if false, only the
    final result is summarized and errors are suppressed.
  name: verbose
  predefined:
  - "true"
  - "false"
  supportedModules: []
- description: |
    A list of integration brands to run enrichment against.
    Example: `"VirusTotal (API v3), AlienVault OTX v2"`.
    - If provided, only the selected brands are used.
    - If left empty, the script runs enrichment on all enabled integrations,
      depending on the `external_enrichment` flag.
    - In order to run core-get-IP-analytics-prevalence, add Cortex Core - IR to the brands list.
    To see the available brands for the `domain` command, run: `!ProvidesCommand command=domain`.
  isArray: true
  name: brands
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: |
    When set to true, the output includes an `AdditionalFields` object
    for each of the indicator result.
    `AdditionalFields` contains all fields returned by Threat Intel or the integrations
    that are not part of the standard output keys: `Name`, `Brand`, `Score`, `Verdict`, `DetectionEngines`,
    `PositiveDetections`.
    When set to false, only the standard keys are returned.
  name: additional_fields
  predefined:
  - "true"
  - "false"
  supportedModules: []
comment: Enriches Domain indicators with reputation data from multiple integrations
  and outputs a consolidated DomainEnrichment object. This script exclusively supports
  indicators of type Domain and will automatically create the indicator in Threat
  Intel if it is not already exists.
