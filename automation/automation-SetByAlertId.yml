args:
- default: true
  description: Alert to set context values in (Default is current alert).
  name: id
  supportedModules: []
- description: The key to set.
  name: key
  required: true
  supportedModules: []
- description: The value to set to the key. Can be an array. Usually, a dq expression.
  name: value
  required: true
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: If false then the context key will be overwritten. If set to true then
    the script will append to existing context key.
  name: append
  predefined:
  - "true"
  - "false"
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "false"
  description: Returns an error if not all of the alerts where modified.
  name: errorUnfinished
  predefined:
  - "true"
  - "false"
  supportedModules: []
comment: "Works the same as the 'Set' command, but can work across alerts by specifying
  'id' as an argument.\nSets a value into the context with the given context key.
  Doesn't append by default.\n\nThis automation runs using the default Limited User
  role, unless you explicitly change the permissions.\nFor more information, see the
  section about permissions here:\n- For Cortex XSOAR 6 see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/6.x/Cortex-XSOAR-Playbook-Design-Guide/Automations
  \n- For Cortex XSOAR 8 Cloud see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8/Cortex-XSOAR-Cloud-Documentation/Create-a-script\n-
  For Cortex XSOAR 8.7 On-prem see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8.7/Cortex-XSOAR-On-prem-Documentation/Create-a-script"
