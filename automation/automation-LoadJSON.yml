script: |
  register_module_line('LoadJSON', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.28'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.28')
  import json





  def load_json(args):
      json_str = args["input"]
      obj = json.loads(json_str, strict=False)

      return {"EntryContext": {"JsonObject": obj}, "Type": entryTypes["note"], "ContentsFormat": formats["json"], "Contents": obj}


  if __name__ in ("__builtin__", "builtins", "__main__"):
      res = load_json(demisto.args())
      demisto.results(res)

  register_module_line('LoadJSON', 'end', __line__())
