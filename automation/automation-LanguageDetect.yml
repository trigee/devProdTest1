dockerimage: demisto/py3-tools:1.0.0.10120494
enabled: true
engineinfo: {}
mainengineinfo: {}
name: LanguageDetect
nativeimage:
- "8.8"
- "8.6"
outputs:
- contextPath: langDetect.lang
  description: Language detection.
- contextPath: langDetect.probability
  description: Probability of language detection.
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('LanguageDetect', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.49'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.49')


  from langdetect import detect_langs


  def detect_language(text):
      res = detect_langs(text)

      md = "### Detected languages (probability):\n"
      langs = []

      for line in res:
          lang = str(line).split(":")[0]
          prob = float(str(line).split(":")[1])
          langs.append({"lang": lang, "probability": prob})
          md += "- " + lang + " (" + str(prob) + ")\n"

      demisto.results(
          {
              "ContentsFormat": formats["json"],
              "Type": entryTypes["note"],
              "Contents": langs,
              "HumanReadable": md,
              "EntryContext": {"langDetect": langs},
          }
      )


  def main():
      text = demisto.args().get("text")
      detect_language(text)


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('LanguageDetect', 'end', __line__())
