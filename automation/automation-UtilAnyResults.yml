script: |
  register_module_line('UtilAnyResults', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.49'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.49')




  def util_any_results(args):
      try:
          res = []
          data = demisto.get(args, "data")
          if isinstance(data, list) and data:
              res.append("yes")
          elif isinstance(data, str) and data:
              if data[0] in ["[", "{"]:
                  data = data[1:]
              if data[-1] in ["]", "}"]:
                  data = data[:-1]
              # If data resembles one of ",,," or "[,,]" or "[]" it is considered empty of results.
              res.append("yes" if data.replace(",", "") else "no")
          else:
              res.append("no")
      except Exception as ex:
          res.append(
              {  # type: ignore
                  "Type": entryTypes["error"],
                  "ContentsFormat": formats["text"],
                  "Contents": "Error occurred while parsing data. Exception info:\n" + str(ex) + "\n\nInvalid data:\n" + str(data),
              }
          )
      return res


  def main():
      args = demisto.args()
      demisto.results(util_any_results(args))

  register_module_line('UtilAnyResults', 'end', __line__())
