comment: "Searches Cortex Alerts and returnrs the most relevant fields. Default search
  range is the last 30 days, if you want to change this, use the fromDate argument.
  \n\nReturns the id, name, type, severity, status, owner, and created/closed times
  to context.  You can add additional fields using the add_field_to_context argument.\n\nThis
  automation runs using the default Limited User role, unless you explicitly change
  the permissions.  Based on the SearchAlertsV2 from the Common Scripts pack, but
  more efficient."
