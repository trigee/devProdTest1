comment: Data output script for populating dashboard pie graph widget with the percentage
  of alerts closed by DBot vs. alerts closed by analysts.
commonfields:
  id: DBotClosedAlertsPercentage
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 5.0.0
    isoverridable: false
    itemVersion: 1.22.52
    packID: CommonScripts
    packName: Common Scripts
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    supportedModules: []
    toServerVersion: ""
enabled: true
engineinfo: {}
mainengineinfo: {}
name: DBotClosedAlertsPercentage
pswd: ""
restrictioncenter: {}
runas: DBotRole
runonce: false
script: |
  // pack version: 1.22.52
  var res = executeCommand("getIncidents", {
      'query': 'status:closed and closingUser:DBot',
      'fromdate': args.from,
      'todate': args.to,
      'size': 0
  });
  var closedByDbot = res[0].Contents.total;

  res = executeCommand("getIncidents", {
      'status': 'closed',
      'fromdate': args.from,
      'todate': args.to,
      'size': 0
  });
  var overallClosed = res[0].Contents.total;

  var result = Math.round(closedByDbot * 100 / overallClosed);
  return isNaN(result) ? 0 : result;
scripttarget: 0
