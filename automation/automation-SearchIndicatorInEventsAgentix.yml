script: |
  register_module_line('SearchIndicatorInEventsAgentix', 'start', __line__())
  CONSTANT_PACK_VERSION = '3.5.81'
  demisto.debug('pack id = Core, pack version = 3.5.81')



  XQL_QUERY_TEMPLATE = 'search "{indicator}" dataset = {data_set}'


  def build_xql_query(indicator: str, data_set: str) -> str:
      """Sanitize the indicator value and build the XQL query string."""
      sanitized = indicator.replace("\\", "\\\\").replace('"', '\\"')
      return XQL_QUERY_TEMPLATE.format(data_set=data_set, indicator=sanitized)


  def extract_results(entry_result: list) -> list:
      """Extract query results from the executeCommand response, returning an empty list on missing keys."""
      try:
          return entry_result[0]["EntryContext"]["GenericXQLQuery"].get("results", [])
      except (KeyError, TypeError, IndexError):
          demisto.debug(f"Could not extract results from XQL query response. Raw response: {entry_result}")
          return []


  def _validate_entry_result(entry_result: list) -> None:
      """Raise if the executeCommand response indicates an error."""
      if isError(entry_result[0]):
          raise DemistoException(f"runXQLQuery command failed: {entry_result[0].get('Contents', 'Unknown error')}")


  def main():
      """Search for an indicator using an XQL query."""
      args = demisto.args()
      indicator = args.get("indicator", "")
      data_set = args.get("data_set") or "xdr_data"
      time_frame = args.get("time_frame") or "7 days"
      query_name = args.get("query_name", "")

      query = build_xql_query(indicator, data_set)

      try:
          entry_result = demisto.executeCommand(
              "runXQLQuery",
              {
                  "query": query,
                  "timeframe": time_frame,
                  "wait_for_results": "true",
                  "widget_name": query_name,
                  "widget_description": f"Search for indicator '{indicator}' in '{data_set}' dataset",
              },
          )
          _validate_entry_result(entry_result)

          outputs = extract_results(entry_result)

          readable_output = tableToMarkdown(f"Query Results for indicator '{indicator}' in '{data_set}' dataset", outputs)

          command_results = CommandResults(
              readable_output=readable_output,
              outputs=outputs,
              outputs_prefix="PaloAltoNetworksXQL",
          )
          return_results(command_results)

      except Exception as e:
          return_error(f"Failed to execute script.\nError:\n{e!s}")


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('SearchIndicatorInEventsAgentix', 'end', __line__())
