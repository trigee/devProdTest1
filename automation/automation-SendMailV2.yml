script: |
  register_module_line('SendMailV2', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.42.13'
  demisto.debug('pack id = Base, pack version = 1.42.13')




  def main():
      """Main entry point for the script."""
      args = demisto.args()
      command_name = "SendMail"  # Variable assignment - avoids hardcoded dependency
      results = execute_command(command_name, args, extract_contents=False)
      return_results(results)


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('SendMailV2', 'end', __line__())
